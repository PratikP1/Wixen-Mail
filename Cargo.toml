[package]
name = "wixen-mail"
version = "0.23.0"
edition = "2024"
# Stated rather than left implicit, so an older toolchain says which version it
# wants instead of failing partway through with a parse error. The edition needs
# 1.85; the real floor is 1.87, because the vendored converter uses
# `char::is_whitespace` in a `const fn` and that only became const-stable then.
# Clippy's incompatible_msrv check is what found that, after 1.85 was claimed
# here on the strength of the edition alone.
rust-version = "1.87"
authors = ["Pratik Patel"]
description = "A fully accessible, light-weight mail client built with Rust and WXDragon"
license = "MIT"
repository = "https://github.com/PratikP1/Wixen-Mail"
keywords = ["email", "mail-client", "accessibility", "imap", "smtp"]
categories = ["email", "gui"]

[dependencies]
# Core
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# The IANA time zone rules, for reading a calendar time out of one named zone
# into another and for writing a zone's rules into a calendar document. The
# rules cannot be hand-written and nothing else in the tree carries them:
# chrono has no zone database and iana-time-zone only names this machine's own.
chrono-tz = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dirs = "6.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-channel = "2.3"
futures = "0.3"

# Mail protocol
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }
mail-parser = "0.11"
reqwest = { version = "0.13", features = ["json", "rustls", "form"] }

# UI Framework: wxdragon (wxWidgets bindings)
wxdragon = { version = "=0.9.17", features = ["aui", "richtext", "webview"] }

# Database for persistent caching
rusqlite = { version = "0.40", features = ["bundled"] }

# Encoding / security
base64 = "0.23"
ammonia = "4.0"
regex = "1.11"
html-escape = "0.2"
aes-gcm = "0.11"
rand = "0.10"

# Spell checking (Hunspell-compatible, pure Rust)
spellbook = "0.4"
# Word boundaries, UAX #29. What counts as a word is not "a run of letters":
# "3rd" is one word, "don't" is one word, and a Japanese sentence has words in
# it and no spaces.
unicode-segmentation = "1.12"

# Open URLs in default browser
open = "5"

# OAuth 2.0 with PKCE support
oauth2 = "4"

# Lightweight HTTP server for OAuth redirect capture
tiny_http = "0.12"

# Secure OS keychain storage for tokens
keyring = "4"

# URL parsing
url = "2"

# CalDAV / iCalendar support
icalendar = "0.17"
quick-xml = "0.41"
scraper = "0.27.0"
ego-tree = "0.11.0"
bitflags = "2.13.1"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
pdfpurr = { version = "0.4.0", default-features = false }
sha2 = "0.11.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
# Only for the platform spell checker, which is COM. Everything else this
# project needs from Windows is a flat call behind a small `#[link]` block, and
# stays that way. Windows-only so a future port does not pay for it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_Foundation",
    # Attaching to the console that launched us, so --help can be read. The
    # binary is a GUI subsystem one and has no console of its own.
    "Win32_System_Console",
    # The named mutex that says a copy is already running, so the uninstaller
    # does not delete the data folder out from under it. CreateMutexW takes
    # security attributes, so it is gated behind Win32_Security as well even
    # though the attributes passed are None.
    "Win32_System_Threading",
    "Win32_Security",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
boa_engine = "0.20"
tokio-test = "0.4"
tempfile = "3.14"

# A held lock guard is how this application deadlocked its own UI thread and
# froze NVDA with it: the guard in an `if let` condition lives for the whole
# block, so a widget call inside that block ran while the state mutex was held,
# and the event it raised tried to take the same mutex again.
#
# Edition 2024 does not fix this. It rescopes the guard so it drops before the
# `else` arm, and leaves the body exactly as it was, because the body may bind
# from the scrutinee. `match` is unchanged as well. So these lints remain the
# only thing standing between us and that deadlock, and there are tests in
# wx_app.rs pinning down both halves of that rule rather than trusting a
# comment. The cost of a false positive is a `let` binding; the cost of a miss
# is a screen reader hanging on a user.
[lints.clippy]
significant_drop_in_scrutinee = "deny"
await_holding_lock = "deny"
