[package]
name = "wixen-mail"
version = "0.55.0"
edition = "2024"
# Stated rather than left implicit, so an older toolchain says which version it
# wants instead of failing partway through with a parse error. The edition needs
# 1.85; the real floor is 1.87, because the vendored converter uses
# `char::is_whitespace` in a `const fn` and that only became const-stable then.
# Clippy's incompatible_msrv check is what found that, after 1.85 was claimed
# here on the strength of the edition alone.
rust-version = "1.87"
authors = ["Pratik Patel"]
description = "A fully accessible, light-weight mail client built with Rust and WXDragon"
license = "MIT"
repository = "https://github.com/PratikP1/Wixen-Mail"
keywords = ["email", "mail-client", "accessibility", "imap", "smtp"]
categories = ["email", "gui"]

# Code that dev and test builds compile and that no shipped binary contains.
#
# `common::what_ships` answers which half of a source file a release build
# compiles. Sixteen checks in `tests/wired.rs` need that answer. It was gated
# `#[cfg(test)]`, which the library's own unit tests reach and an integration
# test does not, because a test under `tests/` links the library built without
# `cfg(test)`. So those sixteen cut the file themselves at the first
# `#[cfg(test)]` and went blind to everything below it: 6,863 lines of
# `wx_app.rs`, holding two production functions no check had ever read.
#
# The dev-dependency below is this package on itself, and that is what turns
# the feature on. Cargo enables it when it builds the library for a dev target
# and not otherwise. Measured both ways with `-v` on 2026-09-02: a test build
# passes `--cfg feature="what-ships"` and a release build passes no feature at
# all, so nothing has to be remembered at release time and no flag can be left
# on by mistake.
#
# Clippy runs `--all-features`, so the gated code is still linted and cannot
# rot behind the flag.
[features]
what-ships = []

[dependencies]
# Core
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# The IANA time zone rules, for reading a calendar time out of one named zone
# into another and for writing a zone's rules into a calendar document. The
# rules cannot be hand-written and nothing else in the tree carries them:
# chrono has no zone database and iana-time-zone only names this machine's own.
chrono-tz = "0.10"
# What this machine calls its own zone, as an IANA name. Needed to judge a
# working day and to space suggested meeting times on the hour where the person
# arranging the meeting is standing, and there is no other way to learn it:
# chrono reports an offset, and an offset is not a zone. Already in the tree
# underneath chrono, so naming it here adds nothing to what is being trusted.
iana-time-zone = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dirs = "6.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-channel = "2.3"
futures = "0.3"

# Mail protocol
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }
mail-parser = "0.11"
reqwest = { version = "0.13", features = ["json", "rustls", "form"] }

# UI Framework: wxdragon (wxWidgets bindings)
wxdragon = { version = "=0.9.17", features = ["aui", "richtext", "webview"] }

# Database for persistent caching
# `functions` so `LOWER` in a query can be this project's own, folding
# case the same way Rust does. SQLite's built-in one folds ASCII only, so a
# search for a name with an accent in it could never match what was stored.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }

# Encoding / security
base64 = "0.23"
ammonia = "4.0"
regex = "1.11"
html-escape = "0.2"
aes-gcm = "0.11"
rand = "0.10"

# Spell checking (Hunspell-compatible, pure Rust)
spellbook = "0.4"
# Word boundaries, UAX #29. What counts as a word is not "a run of letters":
# "3rd" is one word, "don't" is one word, and a Japanese sentence has words in
# it and no spaces.
unicode-segmentation = "1.12"

# Open URLs in default browser
open = "5"

# OAuth 2.0 with PKCE support. Default features off: the crate's own bundled
# HTTP client (an old reqwest/hyper/h2 stack this project never calls) would
# otherwise sit in the binary unused. Token exchange goes through this
# project's own reqwest client in service::oauth instead.
oauth2 = { version = "4", default-features = false }

# Lightweight HTTP server for OAuth redirect capture
tiny_http = "0.12"

# Secure OS keychain storage for tokens
keyring = "4"

# URL parsing
url = "2"

# CalDAV / iCalendar support
icalendar = "0.17"
quick-xml = "0.41"
scraper = "0.27.0"
ego-tree = "0.11.0"
bitflags = "2.13.1"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
pdfpurr = { version = "0.4.0", default-features = false }
sha2 = "0.11.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

# Earcon playback: cross-platform (Windows, macOS, Linux) rather than a
# second Windows-only FFI call, since a real audio path is needed at the
# port and a synthesized tone needs somewhere to play through either way.
# Decodes WAV, OGG, MP3, and FLAC via Symphonia, which is what lets an
# imported sound-scheme pack use more than one format. See
# docs/plans/20260823-earcon-sound-schemes.md for the fuller reasoning.
rodio = "0.22.2"

# Reading an imported sound-scheme pack. Deflate only: the one compression
# method an ordinary zip tool writes by default, and the only one a handful
# of short sound files and a manifest have any reason to need. No lzma, no
# zstd, no bzip2: extra codecs a scheme pack would never use, not extra
# safety.
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

# Packing cached message text. Mail compresses unusually well: measured on
# real prose, a plain body goes to a third, a newsletter to a tenth, and a
# reply chain quoting itself several times over to a fifth. Overall 4.6 to 1,
# which is the difference between a mail cache measured in gigabytes and one
# measured in hundreds of megabytes.
#
# Deflate rather than a stronger codec, and this is a real choice rather than
# inertia: the cost that matters is the one paid on opening a message, which
# lands on the interface thread, and deflate unpacks a body in well under a
# millisecond. It was also already in the tree underneath `zip`. Named here
# because a dependency this code calls directly should say so rather than
# arriving as somebody else's implementation detail.
flate2 = "1.1.9"

# Reading this application's own icon so the notification area can wear it.
# wxWidgets takes a bitmap as raw pixels and the icon is an `.ico` file, so
# something has to decode it, and nothing else in the tree had ever needed to
# read an image.
#
# Three formats and no more: `ico` is the container, and `png` and `bmp` are the
# two things an `.ico` holds. The rest of what this crate can decode is a
# decoder somebody else's file could reach, which is attack surface for a
# feature that reads one file this project ships itself.
image = { version = "0.25", default-features = false, features = ["ico", "png", "bmp"] }
# Reading an Outlook data file, which is what somebody moving off Outlook has
# in their hands: one file holding their mail, calendar, contacts, tasks and
# notes together. The format is Microsoft's, undocumented for most of its life,
# and far too large to write a reader for here.
#
# This crate is Microsoft's own (github.com/microsoft/outlook-pst-rs), which is
# the reason for choosing it over the fork that also writes: the owner of a
# format is the one party that cannot be wrong about it, and only reading is
# needed. Reading is also the whole of the risk, because the file comes from
# somebody else and a fault in a parser handling a stranger's file is reachable
# by that stranger. Nothing here writes one.
outlook-pst = "1.2.0"
# Looking a name up in an organisation's directory while writing to somebody.
# In a workplace most people you write to are in neither your own contacts nor
# any message you have received, and this is the one place they are.
#
# Rustls with ring rather than the platform's own TLS, matching what the rest
# of this project reaches for, and no default features: the crate otherwise
# pulls in a second TLS stack beside the one already here.
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }

# Reading the certificate that came with a signed message: who it was issued
# to, who issued it, and the window it is good for. Both of these were already
# being built here as somebody else's transitive dependency, at these exact
# versions, so naming them adds no code to the binary. They are named because
# `service::signed_mail` calls them directly, and a dependency this code calls
# should say so rather than arriving as another crate's implementation detail,
# which is the same reason `flate2` is named above.
#
# No default features: `verify` and `verify-aws` are for checking one
# certificate against another, which is chain building, and chain building
# belongs to the machine's own root store rather than to this crate.
x509-parser = { version = "0.18", default-features = false }
# Checking that a signature really was made by the key in that certificate.
# This is the one thing in reading signed mail that cannot be written here: an
# RSA or ECDSA verification hand-rolled for a shipped product handling other
# people's mail is exactly the code nobody should write twice.
#
# `ring` rather than the `cms` crate, which would also do the ASN.1: `cms` has
# only ever published pre-release versions, and a pre-release is not something
# to put under a security decision people will read as an answer. The ASN.1 is
# written out longhand in `service::signed_mail` instead.
ring = "0.17"

# Only for the platform spell checker, which is COM. Everything else this
# project needs from Windows is a flat call behind a small `#[link]` block, and
# stays that way. Windows-only so a future port does not pay for it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_Foundation",
    # Attaching to the console that launched us, so --help can be read. The
    # binary is a GUI subsystem one and has no console of its own.
    "Win32_System_Console",
    # The named mutex that says a copy is already running, so the uninstaller
    # does not delete the data folder out from under it. CreateMutexW takes
    # security attributes, so it is gated behind Win32_Security as well even
    # though the attributes passed are None.
    "Win32_System_Threading",
    "Win32_Security",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
boa_engine = "0.20"
tokio-test = "0.4"
tempfile = "3.14"

# This package, on itself, so `what-ships` is on for every dev target and for
# nothing else. Not a third-party crate and not a second copy of the library:
# it is the same one cargo is already building, asked for with one feature
# added. The `[features]` section above says what that buys and how it was
# measured.
wixen-mail = { path = ".", features = ["what-ships"] }

# A held lock guard is how this application deadlocked its own UI thread and
# froze NVDA with it: the guard in an `if let` condition lives for the whole
# block, so a widget call inside that block ran while the state mutex was held,
# and the event it raised tried to take the same mutex again.
#
# Edition 2024 does not fix this. It rescopes the guard so it drops before the
# `else` arm, and leaves the body exactly as it was, because the body may bind
# from the scrutinee. `match` is unchanged as well. So these lints remain the
# only thing standing between us and that deadlock, and there are tests in
# wx_app.rs pinning down both halves of that rule rather than trusting a
# comment. The cost of a false positive is a `let` binding; the cost of a miss
# is a screen reader hanging on a user.
[lints.clippy]
significant_drop_in_scrutinee = "deny"
await_holding_lock = "deny"
