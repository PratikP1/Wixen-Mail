[package]
name = "wixen-mail"
version = "0.1.0-alpha.12"
edition = "2021"
authors = ["Pratik Patel"]
description = "A fully accessible, light-weight mail client built with Rust and WXDragon"
license = "MIT"
repository = "https://github.com/PratikP1/Wixen-Mail"
keywords = ["email", "mail-client", "accessibility", "imap", "smtp"]
categories = ["email", "gui"]

[dependencies]
# Core
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
dirs = "6.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-channel = "2.3"
futures = "0.3"

# Mail protocol
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }
mail-parser = "0.11"
reqwest = { version = "0.13", features = ["json", "rustls", "form"] }

# UI Framework — wxdragon (wxWidgets bindings)
wxdragon = { version = "=0.9.17", features = ["aui", "richtext", "webview"] }

# Database for persistent caching
rusqlite = { version = "0.40", features = ["bundled"] }

# Encoding / security
base64 = "0.23"
ammonia = "4.0"
regex = "1.11"
html-escape = "0.2"
aes-gcm = "0.11"
rand = "0.10"

# Spell checking (Hunspell-compatible, pure Rust)
spellbook = "0.4"

# Open URLs in default browser
open = "5"

# OAuth 2.0 with PKCE support
oauth2 = "4"

# Lightweight HTTP server for OAuth redirect capture
tiny_http = "0.12"

# Secure OS keychain storage for tokens
keyring = "4"

# URL parsing
url = "2"

# CalDAV / iCalendar support
icalendar = "0.17"
quick-xml = "0.41"
scraper = "0.27.0"
ego-tree = "0.11.0"
bitflags = "2.13.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"

# A held lock guard is how this application deadlocked its own UI thread and
# froze NVDA with it: the guard in an `if let` scrutinee lives for the whole
# block on edition 2021, so a widget call inside that block ran while the state
# mutex was held, and the event it raised tried to take the same mutex again.
#
# These two lints name that shape. They are nursery lints, so they have to be
# asked for; the cost of a false positive here is a `let` binding, and the cost
# of a miss is a screen reader hanging on a user.
[lints.clippy]
significant_drop_in_scrutinee = "deny"
await_holding_lock = "deny"
