# Advisories this project has looked at and consciously accepted.
#
# Everything listed here is a decision with a reason and an exit condition.
# Anything NOT listed fails the build, which is the point: the job exists to
# catch the next advisory, not to be silenced wholesale. Review this list when
# the dependencies it names are upgraded.
#
# # Every entry here is checked, and an entry that goes says so here
#
# `scripts/audit.sh` checks on every full local run that each advisory named
# below is still really reported, by a second run that applies no ignore list at
# all. An entry that has stopped applying is not harmless bookkeeping: it names
# an advisory id, so it goes on silencing that id while a second advisory against
# the same crate is reported by nothing.
#
# When an entry goes, say inside the list which one went and why. That placement
# is deliberate. The reader in `audit.sh` strips comments before it looks for
# ids, and a note naming a removed advisory is the shape that would defeat a
# reader which did not, so keeping the notes here is what makes that part of the
# reader load bearing rather than hypothetical. `scripts/audit.test.sh` has the
# case.

[advisories]
ignore = [
    # Four entries went on 2026-09-13, and all four were found by the check
    # described above on the first run it ever made.
    #
    # RUSTSEC-2026-0098, RUSTSEC-2026-0099 and RUSTSEC-2026-0104 named
    # rustls-webpki 0.101.7 and said the fix was an oauth2 5 migration. That
    # migration has not happened: oauth2 is still 4.4.2. The dependency graph
    # moved underneath the entry instead, and the tree now resolves rustls 0.23.42
    # and rustls-webpki 0.103.13, so those three advisories stopped applying and
    # nothing said so. RUSTSEC-2025-0134 named rustls-pemfile, which is no longer
    # in the tree at all.
    #
    # Worth reading as a warning about the shape rather than about those four.
    # None of them was removed by a person deciding anything. They stopped
    # applying as a side effect of an unrelated upgrade, and they would have gone
    # on sitting here silencing four advisory ids indefinitely.

    # Two entries went on 2026-10-25, in the commit that moved wxDragon from
    # 0.9.17 to 0.9.23 (13.4-09), which was the exit condition they were
    # accepted under on 2026-07-26. RUSTSEC-2026-0194 and RUSTSEC-2026-0195
    # were a quick-xml denial of service, reached only through the proc macro
    # wxdragon-macros 0.9.17 and its quick-xml 0.38.4. wxdragon-macros 0.9.23
    # asks for quick-xml 0.42.0, and the unsuppressed audit over the new lock
    # no longer reports either id.

    # paste 1.0.15, unmaintained, no known vulnerability. Note that cargo audit
    # does not fail on an unmaintained warning without `-D warnings`, so this
    # entry has never changed an exit status. What it does is keep the warning
    # out of the output, which is why it still has to be checked: an entry that
    # silences a line is an entry that can silence the wrong line later.
    # Accepted on 2026-07-26 with the two quick-xml entries that went on
    # 2026-10-25. `cargo tree -i paste` on 2026-09-14 named two roots,
    # wxdragon 0.9.17 and the boa crates behind a dev-dependency; wxdragon
    # 0.9.23 still asks for paste in its own manifest, read on 2026-10-25, so
    # it clears when both stop pulling paste in, and neither has since it was
    # accepted.
    "RUSTSEC-2024-0436",

    # atomic-polyfill 1.0.3, unmaintained, no known vulnerability and no patch.
    # It arrived on 2026-09-24 with phonenumber 0.3.10, whose `postcard` asks for
    # `heapless` 0.7, which asks for this crate on five embedded targets only
    # (avr, riscv32i, riscv32imc, thumbv6m, xtensa-esp32s2). A lock file records
    # every target, so it is in Cargo.lock and never compiled for this program.
    # Accepted by name, as paste was, so that a new warning stands out rather
    # than sitting beside one everybody has learned to skip; the default taken
    # in 12-07 on 2026-09-24, Pratik's to overrule. Clears the day `heapless`
    # 0.7 leaves Cargo.lock, and has to be re-judged the day a Windows target
    # starts compiling it.
    "RUSTSEC-2023-0089",

    # Three entries went on 2026-10-19, in the commit that moved zip from
    # 7.2.0 to 9.0.4 (13.2-31.7, ledger 879), which was the exit condition
    # they were accepted under on 2026-10-18. RUSTSEC-2026-0367, 0368 and
    # 0369 were about `ZipArchive::extract` writing entries to disk with
    # their Unix permissions and links, which nothing here calls, and all
    # three are patched at or below 9.0.4.

    # RUSTSEC-2026-0387. crypto-bigint 0.5.5, dated 2026-10-23: several
    # operations meant to take the same time whatever the numbers, among them
    # subtraction, division and Montgomery multiplication, can branch on secret
    # values depending on the compiler and the processor, so their timing can
    # leak what they work on. Patched in 0.7.6 and nothing on the 0.5 line.
    # Accepted on 2026-10-24, as Pratik answered that day ("1 is fine"), as a
    # known risk for now; `.planning/WINDOWS.md` row 954 stays open beside it.
    #
    # Why no lock move clears it. `cargo tree -i crypto-bigint@0.5.5` on
    # 2026-10-24 reaches it only through pgp 0.20.0, by way of the elliptic
    # curve 0.13 family: k256, p256, p384, p521, their ecdsa 0.16 and
    # primeorder, and cx448. pgp 0.21.0 of 2026-10-03, the newest on crates.io
    # that day by `cargo search pgp`, still asks for elliptic-curve, k256 and
    # p256 at 0.13 and cx448 at 0.1.1 in its own manifest, read that day, so
    # moving pgp would not move this either.
    #
    # What it reaches. Only OpenPGP keys on elliptic curves: reading or making
    # a signature, or opening a message, with such a key. RSA keys go through
    # rsa 0.9.10, which uses num-bigint-dig and not this crate (its own risk is
    # the RUSTSEC-2023-0071 entry below). S/MIME goes through Windows' CNG and
    # never reaches either. Exploiting a timing leak like this one needs an
    # attacker able to time OpenPGP operations precisely on the machine doing
    # them, many times over, and a mail client opening a message on its
    # reader's own computer gives a sender no such measurement; the
    # RUSTSEC-2023-0071 entry below argues the same about what goes back to a
    # sender, and that argument's expiry condition applies here as well. The
    # PGP key manager is still labelled experimental on the File menu.
    #
    # Exit condition: remove this entry when pgp moves to elliptic-curve 0.14
    # or later on crypto-bigint 0.7.6 or later, and Cargo.lock no longer
    # holds crypto-bigint 0.5. Check at every pgp release. `scripts/audit.sh`
    # refuses an accepted id that is no longer reported, so it cannot outstay
    # that move.
    "RUSTSEC-2026-0387",

    # RUSTSEC-2023-0071. rsa 0.9.10, reached through pgp 0.20.0, which is how
    # this program reads OpenPGP mail. Decided on 2026-09-13 after being held
    # open, undecided, since the local audit gate was written three days before.
    #
    # ## What the advisory is, which is more than its summary says
    #
    # It reads as "Marvin Attack: potential key recovery through timing
    # sidechannels", 5.9 medium, and that undersells it. Its own tracking issue,
    # RustCrypto/RSA issue 626, holds four separate concerns rather than one bug:
    #
    #   Modexp timing                      fixed, constant-time backend, issue 19
    #   The Ok or Err behavioural oracle   open, PR 680, not a draft
    #   Constant-time left-padding         open, folded into PR 680
    #   Unblinded modexp on the default path   open, PR 702, still a draft
    #
    # The second is the one to read. On 2026-06-01 a researcher ran the adaptive
    # Bleichenbacher attack end to end against published rsa 0.10.0-rc.18: it
    # recovers a full RSA-1024 plaintext in 275,490 queries and forges a
    # signature over a chosen message, read straight off the Ok or Err return
    # value with no timing involved at all. A behavioural oracle that needs no
    # timing is a different thing from a timing side channel, and a worse one.
    # Anyone re-judging this entry needs that fact and the query count, because
    # the severity score and the title do not carry them.
    #
    # ## Why there is nothing to upgrade to and nothing to switch off
    #
    # pgp 0.20.0 is the latest published version and this project is on it. In
    # its manifest, [dependencies.rsa] carries no `optional = true` and no
    # feature excludes it. `large-rsa` is about key sizes, not presence. An
    # OpenPGP implementation cannot drop RSA and still read most existing PGP
    # mail. rsa 0.10.0-rc.18 exists and is a release candidate, and this
    # advisory's `patched` list is empty, so nothing is marked fixed. cargo audit
    # says the same thing in one line: "No fixed upgrade is available!".
    #
    # An alternative does exist, and it was refused for a reason that has nothing
    # to do with this advisory. sequoia-openpgp with its Nettle backend does not
    # use this crate. It is LGPL-2.0-or-later against an MIT project shipping a
    # statically linked binary, which is a decision about how the product may be
    # distributed, and it needs a C library and pkg-config at build time. Its
    # pure Rust backend is turned on with `allow-experimental-crypto` and
    # `allow-variable-time-crypto`, which is worse than what is accepted here.
    # The whole comparison is in docs/development/pgp-implementation-choice.md.
    # Saying "there is no alternative" would be false; the alternative was
    # refused on licence and build cost, and a later reader may weigh that
    # differently.
    #
    # ## Why accepting it is right today, and this is an argument not a proof
    #
    # The attack needs roughly 275,000 adaptive queries, each one answered with
    # an observable success or failure. A mail client reading mail on the
    # reader's own machine gives a sender no per-query feedback: what happened
    # when a PGP message was opened is shown to the person reading and goes
    # nowhere else.
    #
    # Two things narrow it further. S/MIME decryption now happens, since 13-14 on
    # 2026-09-26, and it goes through Windows' own CNG with the key where it
    # lives, in src/service/signed_mail.rs, which is not the `rsa` crate this
    # advisory is about. It is held to the same rules all the same, because an
    # oracle about any key is one: a page holding decrypted content fetches no
    # picture whatever the setting says, a meeting found inside it changes
    # nothing on the calendar on its own, and the read receipt is still decided
    # from the header alone. And the PGP key manager, File, PGP Keys, where keys
    # are imported, is labelled experimental on the File menu, so very few
    # machines hold a key for anything to be an oracle about.
    #
    # The one automatic outbound response this program has was checked rather
    # than assumed, because "this program sends nothing back" is exactly the kind
    # of absence claim that is wrong. A read receipt is decided in
    # `receipt_for_the_open_message` in src/presentation/wx_app.rs, from the
    # Disposition-Notification-To header, which PGP leaves in the clear because
    # it encrypts the body and not the headers. It is sent when a message is
    # selected, not when a body decrypts. So a sender who sets that header and
    # sends 275,000 messages gets 275,000 identical answers, each of which says
    # "this was opened" and none of which says "this decrypted". The setting is
    # Never by default, and a receipt to anything in the junk folder is refused
    # whatever the setting says.
    #
    # ## The expiry condition
    #
    # The day anything in this program gives a sender a distinguishable,
    # observable response to a PGP message, the oracle becomes real and this
    # entire argument expires. An auto-reply, a bounce, a read receipt tied to
    # decryption succeeding, a delivery notification that differs by outcome, or
    # a background fetch whose presence or timing depends on whether a body
    # opened. Any of them.
    #
    # The line it turns on, named so it can be recognised: today
    # `receipt_for_the_open_message` decides what to send without reading
    # `crate::service::pgp::WhatOpeningItFound` at all, and without reading
    # whether an S/MIME envelope opened. Make what is sent depend on either
    # value, in either direction, and the channel exists. Beside it now,
    # `HtmlRenderer::for_mail_opened_from_encryption` in
    # src/presentation/html_renderer.rs, which `the_renderer_for` in
    # src/presentation/reader_text.rs asks for any page holding a message that
    # opened here, S/MIME or PGP/MIME: it holds every picture back whatever the
    # Reading tab says. Let the setting decide there and the fetch of a picture
    # says "this decrypted" to whoever hosts it, and a decrypted body of either
    # kind is usually HTML.
    #
    # Whoever adds such a feature in a year will not connect it to a security
    # advisory. That is why the condition is written in the words they would
    # recognise rather than in the words the advisory uses.
    #
    # One such feature arrived on 2026-09-19 and was connected, so this
    # records why the condition did not trip. Pictures a message points at
    # are fetched by default from that day (#28, `hold_back_remote_pictures`
    # off), which is a background fetch, and the question is whether its
    # presence depends on whether a body opened. It does not, and since 13-15
    # on 2026-09-26 for two reasons rather than one. An inline PGP message that
    # opens is still handed on as `MessageBody::Plain`, its words as text, by
    # `the_body_to_show` in src/application/opening_pgp.rs, and text is escaped
    # into the page and never parsed for a picture. A PGP/MIME message that
    # opens can be HTML, because what it holds is a whole MIME entity, so its
    # pictures are not held back by being text: `for_pgp_mime` in the same file
    # hands it on as `WhatTheEnvelopeSays::OpenedWithPgp`, `is_opened` in
    # src/application/encrypted_mail.rs answers yes for it as for an opened
    # S/MIME envelope, and its page is built by the renderer named above, which
    # fetches nothing. A message that did not open is shown as its armour. So
    # the fetch still says nothing about whether anything decrypted. The line
    # this now also turns on: let decrypted content decide whether a picture is
    # fetched, by leaving a kind of opened message out of `is_opened` or by
    # handing its page a renderer that asks the setting, and the fetch says
    # "this decrypted" to whoever hosts the picture.
    #
    # ## What to watch, and it is not the advisory
    #
    # RustCrypto/RSA PR 680. The advisory clears only when all four concerns are
    # closed and a version is published, which may be a long way off. PR 680 is
    # the one that closes the behavioural oracle, and the behavioural oracle is
    # what the argument above is about. When it lands and is released, re-read
    # this entry rather than waiting for the advisory to change.
    #
    # ## What was measured here and what was taken on trust
    #
    # Checked on this machine on 2026-09-13: both crate versions in Cargo.lock;
    # pgp 0.20.0's own manifest, read from the vendored crate source; the
    # advisory's empty `patched` list in the local advisory database and cargo
    # audit's "No fixed upgrade is available!" line; and every claim above about
    # this program's own code.
    #
    # Taken from the investigation of the same day and not re-checked, because
    # this machine could reach neither crates.io nor GitHub while this was
    # written: that pgp 0.20.0 is the latest published version, the contents of
    # RustCrypto/RSA issue 626 and of PRs 680 and 702, and the 2026-06-01 result
    # with its query count. Anyone re-judging this should re-read those three
    # rather than trust this paragraph.
    "RUSTSEC-2023-0071",
]
