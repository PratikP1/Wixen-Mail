# Which code is worth asking "would any test notice if this were wrong".
#
# Mutation testing changes the code in small ways and runs the suite. A mutant
# that survives means no test was watching, so either the behaviour is unpinned
# or the code is dead. It is the only thing that answers the question a passing
# suite cannot: a test written after the code it covers describes what the code
# does, and this project wrote most of its tests that way. Red/green started at
# commit 182 of 344.

# The wxWidgets layer is left out, and not because it does not matter.
#
# It cannot be exercised without a display and a running application, so every
# mutant in it would survive and say nothing except "this needs a person". Its
# verification is a screen reader pass, which is tracked as work rather than
# pretended at here. Including it would bury the signal from the code that can
# be checked under thousands of expected survivors.
exclude_globs = [
    "src/presentation/wx_*.rs",
    "src/presentation/managers.rs",
    "src/main.rs",
    # Vendored, and not ours to specify.
    "src/vendor/**",
]

# Anything that only builds a string for a person to read. A mutant there is
# real but the report is noise next to a mutant in the mail parser: nobody
# loses a message because a status line reads oddly, and these are read back by
# the accessibility tests that do exist.
exclude_re = [
    "impl Display",
    "fn fmt\\(",
]

# A mutant that takes much longer than the baseline is one that hung rather
# than one that is slow.
#
# The suite takes about 46 seconds, measured on 2026-08-06 with nothing else
# running, and 57 in that same run's own baseline with a build going alongside
# it. It used to say four seconds here, which was true when it was written and
# was out by a factor of ten by the time anybody read it again. That number is
# what these two settings are read against, so it is worth re-measuring rather
# than trusting: `cargo test --all-targets` prints it.
#
# The whole-tree run of 2026-08-05 reported 81 timeouts, all in one file,
# including pure string builders with no loop in them at all. Those were the
# machine being busy, not code hanging. Lowering the multiplier, or excluding
# the file, would have hidden the same thing again next time.
timeout_multiplier = 5.0
minimum_test_timeout = 60
