# Which code is worth asking "would any test notice if this were wrong".
#
# Mutation testing changes the code in small ways and runs the suite. A mutant
# that survives means no test was watching, so either the behaviour is unpinned
# or the code is dead. It is the only thing that answers the question a passing
# suite cannot: a test written after the code it covers describes what the code
# does, and this project wrote most of its tests that way. Red/green started at
# 18a02454 on 2026-07-26. How much of the history predates it is computed and
# printed on every commit by
# test_the_share_of_history_before_red_green_is_computed_and_printed in
# tests/every_number_carries_its_command_and_its_date.rs: 8.9% on 2026-09-14.
# This comment used to give the commit's position and the count on the day it
# was written, two absolutes that stayed true while the share they implied
# fell from 53%.

# The wxWidgets layer is left out, and not because it does not matter.
#
# It cannot be exercised without a display and a running application, so every
# mutant in it would survive and say nothing except "this needs a person". Its
# verification is a screen reader pass, which is tracked as work rather than
# pretended at here. Including it would bury the signal from the code that can
# be checked under thousands of expected survivors.
exclude_globs = [
    "src/presentation/wx_*.rs",
    "src/presentation/managers.rs",
    "src/main.rs",
    # Vendored, and not ours to specify.
    "src/vendor/**",
]

# Anything that only builds a string for a person to read. A mutant there is
# real but the report is noise next to a mutant in the mail parser: nobody
# loses a message because a status line reads oddly, and these are read back by
# the accessibility tests that do exist.
exclude_re = [
    "impl Display",
    "fn fmt\\(",
]

# A mutant that takes much longer than the baseline is one that hung rather
# than one that is slow.
#
# What the two settings are read against. At the start of every run the tool
# runs the suite once on the unmutated tree and takes that as its baseline;
# each mutant then gets `timeout_multiplier` times that baseline, floored at
# `minimum_test_timeout` seconds. So neither value below is a number of
# seconds on its own, and the figure a reader needs in order to judge them is
# what the suite takes on this machine on the day.
#
# Taken 2026-09-14 at `9399a1e2`, twice each, with nothing else building and
# every target already built, timed with `date +%s` around the command in
# bash:
#
#   `cargo test --all-targets`, the harness's default thread count, which is
#   what the tool runs per mutant unless told otherwise: 104 s and 103 s,
#   7,687 tests passed, summed over the 55 result lines the run prints.
#
#   `cargo test --lib -- --test-threads=8`, the library alone, which is what
#   a run may be told to use instead by passing it after `--`: 52 s and 52 s,
#   7,244 passed and 1 ignored.
#
# Which of the two applies is decided by what follows `--` on the run's
# command line, and the baseline the tool takes will be whichever one it was
# told to run. With the multiplier at 5, a mutant is called hung after about
# 520 s under the first shape and about 260 s under the second; the floor of
# 60 s is below both, so it only ever bites when the baseline is short.
#
# The row on docs/development/measurements.md carries the same two figures.
# This paragraph said "about 46 seconds, measured on 2026-08-06" until
# 2026-09-14, and before that it said four seconds, which was true when it was
# written and was out by a factor of ten by the time anybody read it again.
#
# The whole-tree run of 2026-08-05 reported 81 timeouts, all in one file,
# including pure string builders with no loop in them at all. Those were the
# machine being busy, not code hanging. Lowering the multiplier, or excluding
# the file, would have hidden the same thing again next time.
#
# On GitHub's runners on 2026-09-15, at `3e633252`, the every-target baseline
# ran 187 to 277 s per shard, so the multiplier set each mutant's budget at
# about 935 to 1,385 s there, and 870 mutants across two runs produced four
# timeouts. All four timed out again on this machine at a 594 s budget with
# nothing else running, and each is the mutant's own doing: two turn a loop's
# step into one that never advances, and two make every test that opens a
# connection wait out its own limit, ninety times over. Neither setting moved;
# docs/plans/20260915-whole-tree-mutation-run.md has the four by name.
timeout_multiplier = 5.0
minimum_test_timeout = 60
