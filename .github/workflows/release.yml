name: Release

# Releases are cut deliberately, never as a side effect of pushing.
# A push to main used to trigger this workflow, which meant any merge
# bumped the version and published a tag with nobody deciding to.
on:
  workflow_dispatch:
    inputs:
      release_level:
        description: "How to bump. patch or minor for ordinary versions; alpha, beta or rc to stage the next one; release to drop a prerelease suffix."
        required: true
        type: choice
        options:
          # Ordinary development, which is where most releases land. 0.x
          # already means unstable, so a version needs no suffix to say so.
          - patch
          - minor
          # Staging a release that is about to go to people. Each of these
          # bumps from the current version and starts or advances a
          # prerelease series: 0.5.0 then alpha gives 0.5.1-alpha.1.
          - alpha
          - beta
          - rc
          # Drop the suffix and cut the thing the prereleases were for.
          - release

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quality-gate:
    name: Release Quality Gate
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --quiet

  build-release-assets:
    name: Build setup executables
    needs: quality-gate
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-release
        run: cargo install cargo-release --locked

      - name: Configure git user
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release version and tag
        run: >
          cargo release ${{ inputs.release_level }} --execute --no-confirm --no-publish
          --allow-branch main --push-remote origin

      - name: Capture release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = (git describe --tags --abbrev=0).Trim()
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # Alpha, beta, and rc are prereleases. A bare version is a real release.
          $prerelease = if ($tag -match '-(alpha|beta|rc)') { 'true' } else { 'false' }
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing $tag with prerelease=$prerelease"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # The same script CI runs and the same one you run locally, so the file
      # people download is built the way the one you tested was. It reads the
      # version from Cargo.toml, which cargo-release has already bumped, so the
      # installer cannot be labelled with a different number from the tag.
      - name: Build the release binary and the setup executable
        shell: bash
        run: bash scripts/build-installer.sh

      - name: Prepare the portable download
        shell: pwsh
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          Copy-Item "target/release/wixen-mail.exe" "dist/wixen-mail-$tag.exe"
          Compress-Archive -Path "target/release/wixen-mail.exe" -DestinationPath "dist/Wixen-Mail-$tag-windows.zip" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wixen-mail-release-assets
          path: dist/*

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.release_tag.outputs.prerelease }}
          files: |
            dist/Wixen-Mail-Setup-*.exe
            dist/wixen-mail-v*.exe
            dist/Wixen-Mail-*-windows.zip
            docs/changelog.md
          fail_on_unmatched_files: false
