name: Release

# Releases are cut deliberately, never as a side effect of pushing.
# A push to main used to trigger this workflow, which meant any merge
# bumped the version and published a tag with nobody deciding to.
on:
  workflow_dispatch:
    inputs:
      release_level:
        description: "How to bump. as-is to publish the version Cargo.toml already carries; alpha, beta or rc to advance the stage; release to drop a prerelease suffix; patch or minor for ordinary versions, never on a prerelease."
        required: true
        type: choice
        options:
          # Publish the version Cargo.toml already carries, without bumping
          # it. The tree's version is the next build to go to testers and
          # was moved in the commit that changed behaviour, so there is
          # nothing left to bump: from 1.0.0-alpha.1, `alpha` would publish
          # -alpha.2 and nothing could ever publish -alpha.1. This is the
          # level the alpha uses. A prerelease suffix still makes it a
          # GitHub prerelease, because that is decided from the tag below.
          - as-is
          # Staging a release that is about to go to people. Each of these
          # bumps from the current version and starts or advances a
          # prerelease series: 0.5.0 then alpha gives 0.5.1-alpha.1.
          - alpha
          - beta
          - rc
          # Drop the suffix and cut the thing the prereleases were for.
          - release
          # Ordinary development after 1.0.0. Never on a prerelease:
          # cargo-release reads `patch` on 1.0.0-alpha.N as "remove the
          # suffix" and cuts 1.0.0 as a full release.
          - patch
          - minor

env:
  CARGO_TERM_COLOR: always
  # The quality gate below runs the tests on a runner with no Microsoft Print
  # to PDF (actions/runner-images#12328), so the spool test would fail it.
  # With this set it asserts the printer really cannot be opened instead;
  # ci.yml says more. This adds a value and changes no trigger, level or step.
  WIXEN_NO_PDF_PRINTER: "1"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quality-gate:
    name: Release Quality Gate
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --quiet

  build-release-assets:
    name: Build setup executables
    needs: quality-gate
    runs-on: windows-latest

    # Every file this release promises, written once.
    #
    # The step that checks they exist and the step that publishes them both
    # read this list, so the two cannot come to disagree about what a release
    # is. Two copies of four globs agree right up until somebody edits one of
    # them, and the release that finds out is the one that publishes three
    # files and says nothing about the fourth.
    env:
      RELEASE_ASSETS: |
        dist/Wixen-Mail-Setup-*.exe
        dist/wixen-mail-v*.exe
        dist/Wixen-Mail-*-windows.zip
        docs/changelog.md

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install cargo-release
        run: cargo install cargo-release --locked

      - name: Configure git user
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `as-is` hands cargo-release the version itself rather than a level,
      # read off the same line scripts/build-installer.sh:12 reads, so the
      # tag is the number the tree carries. Given its current version,
      # cargo-release 1.1.5 plans no bump, skips the commit when no file
      # changed (`commit_all` in its ops/git.rs), and tags `v1.0.0-alpha.1`:
      # a dry run on 2026-09-16 from a tree at 1.0.0-alpha.1 planned exactly
      # the tag and the push.
      - name: Create release version and tag
        shell: bash
        run: |
          level="${{ inputs.release_level }}"
          if [ "$level" = "as-is" ]; then
            level=$(grep -m1 -E '^version = "' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
            echo "Publishing the version Cargo.toml already carries: $level"
          fi
          cargo release "$level" --execute --no-confirm --no-publish \
            --allow-branch main --push-remote origin

      - name: Capture release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = (git describe --tags --abbrev=0).Trim()
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # Alpha, beta, and rc are prereleases. A bare version is a real release.
          $prerelease = if ($tag -match '-(alpha|beta|rc)') { 'true' } else { 'false' }
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing $tag with prerelease=$prerelease"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # The same script CI runs and the same one you run locally, so the file
      # people download is built the way the one you tested was. It reads the
      # version from Cargo.toml, which cargo-release has already bumped, so the
      # installer cannot be labelled with a different number from the tag.
      - name: Build the release binary and the setup executable
        shell: bash
        run: bash scripts/build-installer.sh

      - name: Prepare the portable download
        shell: pwsh
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          Copy-Item "target/release/wixen-mail.exe" "dist/wixen-mail-$tag.exe"
          Compress-Archive -Path "target/release/wixen-mail.exe" -DestinationPath "dist/Wixen-Mail-$tag-windows.zip" -Force

      # A release that cannot produce a file it promised stops here, before
      # anything is announced.
      #
      # `fail_on_unmatched_files` below is the second net and not a substitute
      # for this one. It fires inside the publishing step, by which point the
      # tag is on the remote and the release exists, so a missing asset caught
      # only there is already a half-published release somebody can find.
      #
      # The tag is pushed earlier still, by `cargo release`, so even this
      # failure leaves a tag with nothing behind it. Moving that is a change to
      # when a tag exists, which is a change to when a release happens, and
      # guardrail 7 says that is a deliberate decision rather than something a
      # change about asset names makes on the way past. Recorded in
      # `.planning/WINDOWS.md` instead.
      - name: Check that every promised file exists
        shell: pwsh
        run: |
          $promised = $env:RELEASE_ASSETS -split "`n" |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ }
          if (-not $promised) {
            Write-Host "::error::No promised files were read, so this step would pass without checking anything."
            exit 1
          }
          $missing = @()
          foreach ($pattern in $promised) {
            $found = @(Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) {
              $missing += $pattern
            } else {
              $found | ForEach-Object { Write-Host "  $($_.Name)" }
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::This release promised files it did not produce, so it stops instead of publishing the rest:"
            $missing | ForEach-Object { Write-Host "::error::  $_ matched nothing" }
            exit 1
          }
          Write-Host "Every promised file is here."

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wixen-mail-release-assets
          path: dist/*

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.release_tag.outputs.prerelease }}
          files: ${{ env.RELEASE_ASSETS }}
          # The second net. Its own documentation calls this the "Indicator of
          # whether to fail if any of the files globs match nothing", so with it
          # false a glob that stopped matching was published as an absence and
          # the run stayed green.
          fail_on_unmatched_files: true
