name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  # These runners ship no audio driver (actions/runner-images#6983), and
  # rodio 0.22.2 does not fail cleanly there: it opens something anyway and
  # faults on the first write, killing the test binary. That is not two
  # failing tests, it is every test scheduled after the crash never running,
  # and about 3,500 of ours were lost that way with nothing saying so.
  #
  # This does not skip a single sound test. They all still run and all still
  # assert; the sound goes to a mixer with nothing listening instead of to a
  # card. src/presentation/accessibility/feedback.rs has the detail.
  WIXEN_NO_AUDIO: "1"

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: windows-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    # --no-fail-fast because without it cargo stops at the first target that
    # fails, and the library is the first target. One failing test there means
    # none of the fourteen files under tests/ run at all, so this job could go
    # red for one reason while saying nothing about the fourteen it never
    # reached. --all-targets to match scripts/check.sh, which is meant to be
    # this job run locally.
    - name: Run tests
      run: cargo test --all-targets --verbose --no-fail-fast

    # The search handler is a crate of its own rather than a workspace member,
    # so every cargo command above walks straight past it. It had no check of
    # any kind until scripts/build-installer.sh started building it, at which
    # point a broken commit there would break installer builds with nothing
    # having gone red first.
    #
    # if: always() for the same reason as --no-fail-fast above, one level up. A
    # job stops at its first failing step, and because this crate is a
    # workspace outsider nothing else anywhere reaches it, so a red step above
    # leaves it wholly unchecked rather than checked by something else. That is
    # not hypothetical: this step was reported skipped on every run from
    # 2026-07-31 to 2026-09-03. The step still fails the job when it should.
    # tests/house_style.rs::test_one_failing_target_does_not_hide_the_rest
    # holds every step here to it.
    - name: Run the search handler's tests
      if: always()
      run: cargo test --all-targets --verbose --no-fail-fast
      working-directory: search-handler

  fmt:
    name: Rustfmt
    runs-on: windows-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
        
    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Check the search handler's formatting
      if: always()
      run: cargo fmt --all -- --check
      working-directory: search-handler

  clippy:
    name: Clippy
    runs-on: windows-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
        
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run clippy on the search handler
      if: always()
      run: cargo clippy --all-targets --all-features -- -D warnings
      working-directory: search-handler

    # The scripts that decide what the commit gate runs, and whether a failing
    # test may be committed at all. They have their own suites, and for a day
    # nothing ran them: not the gate, not CI. A defect in either is a defect in
    # every check this project makes.
    - name: Test the scripts that decide what runs
      shell: bash
      run: |
        for suite in scripts/*.test.sh; do
          bash "$suite"
        done


  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Audit dependencies
      # Advisories reach this project through transitive dependencies, so a
      # green build says nothing about them. This is the check that does.
      #
      # Accepted advisories live in .cargo/audit.toml with a reason and an
      # exit condition each. Anything not on that list fails here, which is
      # the whole point of the job.
      run: cargo audit

  build:
    name: Build
    runs-on: windows-latest
    
    permissions:
      contents: read
    
    strategy:
      matrix:
        profile: [debug, release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build (Debug)
      if: matrix.profile == 'debug'
      run: cargo build --verbose

    - name: Build (Release)
      if: matrix.profile == 'release'
      run: cargo build --release --verbose

  installer:
    name: Setup Executable
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-release-${{ hashFiles('**/Cargo.lock') }}

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    # Built on every push rather than only at release time. A mistake in the
    # setup script is otherwise found while cutting a release, which is the
    # worst moment to find it, and the same script runs here and there.
    - name: Build the setup executable
      shell: bash
      run: bash scripts/build-installer.sh

    - name: Keep the setup executable
      uses: actions/upload-artifact@v4
      with:
        name: setup-executable
        path: dist/Wixen-Mail-Setup-*.exe
