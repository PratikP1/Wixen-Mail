name: Accessibility

# Automated scanning of the running application, on both accessibility channels.
#
# Windows has two. Axe.Windows reads UI Automation, which is what Narrator uses.
# The second step walks MSAA through IAccessible, which is what NVDA uses for
# native controls and the only place `set_accessible_name` puts anything: for an
# edit box or a button, Windows supplies its own UI Automation provider that
# shadows the MSAA object underneath, so the UI Automation scan reports the
# system's name and never the one this code set. It had therefore never measured
# a single accessible name in this application, in either direction, and would
# not have noticed every one of them being deleted.
#
# Together they catch roughly half of accessibility defects: missing or empty
# accessible names, wrong control types, unreachable elements, contrast failures
# the scanner can measure. Neither replaces testing with NVDA, JAWS, or
# Narrator. A clean scan means the structure is present, not that the experience
# is good.
#
# The job is non-blocking on purpose. Treat its findings as a work queue, not a
# gate, and read the uploaded report rather than the pass/fail badge.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  uia-scan:
    name: Accessibility scan
    runs-on: windows-latest
    continue-on-error: true

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-a11y-${{ hashFiles('**/Cargo.lock') }}

    - name: Build application
      run: cargo build --release --verbose

    - name: Install Axe.Windows CLI
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force tools/axe-windows | Out-Null
        $release = Invoke-RestMethod 'https://api.github.com/repos/microsoft/axe-windows/releases/latest'
        $asset = $release.assets | Where-Object { $_.name -like 'AxeWindowsCLI*.zip' } | Select-Object -First 1
        if (-not $asset) { throw 'No AxeWindowsCLI zip in the latest axe-windows release' }
        Invoke-WebRequest $asset.browser_download_url -OutFile axe-cli.zip
        Expand-Archive axe-cli.zip -DestinationPath tools/axe-windows -Force
        Write-Host "Installed $($asset.name)"

    - name: Scan the running application
      id: scan
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        # One run per window. --processid covers every window the process owns,
        # which sounds like everything and is not: at the moment of the scan
        # the process owns one window, so every dialog in the application, and
        # therefore most of its controls, had never been scanned by anything.
        #
        # The names are the ones src/presentation/scan_target.rs accepts, and
        # it refuses one it does not know rather than starting normally, so a
        # typo here fails loudly instead of scanning the main window twice and
        # calling it a pass.
        $targets = @('main', 'settings', 'accounts', 'compose', 'reader', 'search', 'filters', 'calendar', 'first-run', 'add-calendar')

        # Point the app at a throwaway profile so the scan never touches real
        # user data and always starts from the same first-run state.
        #
        # WIXEN_MAIL_DATA, not LOCALAPPDATA. The application finds its folder
        # through the Windows known-folder API, which does not read
        # LOCALAPPDATA, so setting that isolated nothing: it looked like a
        # throwaway profile and was the real one.
        $env:WIXEN_MAIL_DATA = Join-Path $env:RUNNER_TEMP 'a11y-profile'
        New-Item -ItemType Directory -Force $env:WIXEN_MAIL_DATA | Out-Null

        $total = 0
        $broken = @()
        $perWindow = @()
        # Windows holding a control somebody operates that has no name on the
        # channel NVDA reads.
        $unnamed = @()

        foreach ($target in $targets) {
          # Axe.Windows rejects a relative --outputdirectory, and each window
          # gets its own so the artifact says which result came from where.
          $outDir = Join-Path (Get-Location) "a11y-results/$target"
          New-Item -ItemType Directory -Force $outDir | Out-Null

          $arguments = if ($target -eq 'main') { @() } else { @("--scan-target", $target) }
          $app = Start-Process -FilePath 'target/release/wixen-mail.exe' `
            -ArgumentList $arguments -PassThru
          try {
            # wxWidgets needs a moment to realise the frame and publish its
            # UI Automation tree. Poll rather than guess at a fixed sleep.
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and $app.MainWindowHandle -eq 0) {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
            }
            if ($app.MainWindowHandle -eq 0) {
              $broken += "$target : no window appeared within 60s"
              continue
            }
            # The dialog opens after the main frame is shown, so give it a
            # moment to exist before walking the tree.
            if ($target -ne 'main') { Start-Sleep -Seconds 3 }

            # Axe exits non-zero both when it finds violations and when it
            # fails to scan at all, so the exit code alone cannot tell those
            # apart. Whether it wrote a result file is what distinguishes them,
            # and that check has to be per window: one window failing to scan
            # while the others succeed would otherwise be invisible, because
            # the directory would still have files in it.
            $PSNativeCommandUseErrorActionPreference = $false
            $output = & tools/axe-windows/AxeWindowsCLI.exe `
              --processid $app.Id `
              --outputdirectory $outDir `
              --verbosity verbose 2>&1
            Write-Host "--- $target ---"
            $output | Out-String | Write-Host

            if (-not (Get-ChildItem $outDir -Filter *.a11ytest -ErrorAction SilentlyContinue)) {
              $broken += "$target : no result file, so the scan itself failed (exit $LASTEXITCODE)"
              continue
            }

            # "8 errors were found" / "No errors were found"
            $summary = ($output | Select-String -Pattern '(\d+) errors? were found|No errors were found' | Select-Object -First 1)
            $count = if ($summary -and $summary.Matches[0].Groups[1].Success) {
              [int]$summary.Matches[0].Groups[1].Value
            } else { 0 }
            $total += $count
            $perWindow += "$target : $count"
            Write-Host "$target scanned with $count violation(s)."

            # The other channel, on the same running window. Exit 2 means the
            # walk itself failed, which is not a window with nothing wrong with
            # it and is recorded as broken rather than as a pass.
            $PSNativeCommandUseErrorActionPreference = $false
            & pwsh -NoProfile -File scripts/msaa-names.ps1 `
              -ProcessId $app.Id `
              -Json (Join-Path $outDir 'msaa-names.json')
            $msaaExit = $LASTEXITCODE
            if ($msaaExit -eq 2) {
              $broken += "$target : the MSAA walk failed, so its names were never read"
            } elseif ($msaaExit -eq 1) {
              $unnamed += $target
            }
          }
          finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
        }

        "violations=$total" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        ($perWindow -join '; ') | ForEach-Object { "perwindow=$_" } |
          Out-File -FilePath $env:GITHUB_OUTPUT -Append
        ($broken -join '; ') | ForEach-Object { "broken=$_" } |
          Out-File -FilePath $env:GITHUB_OUTPUT -Append
        ($unnamed -join ', ') | ForEach-Object { "unnamed=$_" } |
          Out-File -FilePath $env:GITHUB_OUTPUT -Append

        if ($broken.Count -gt 0) {
          # A window that could not be scanned is not a window with no
          # problems. Saying so is the whole reason this distinction exists.
          throw "These windows were not scanned: $($broken -join '; ')"
        }
        Write-Host "All $($targets.Count) windows scanned, $total violation(s) in total."

    - name: Summarise findings
      if: always()
      shell: pwsh
      run: |
        $results = Get-ChildItem a11y-results -Recurse -Filter *.a11ytest -ErrorAction SilentlyContinue
        Add-Content $env:GITHUB_STEP_SUMMARY '## Accessibility scan'
        Add-Content $env:GITHUB_STEP_SUMMARY ''
        if (-not $results) {
          Add-Content $env:GITHUB_STEP_SUMMARY 'The scan did not run. No result file was produced, so this is a broken scan rather than a clean one. Check the scan step log.'
          exit 0
        }
        $broken = '${{ steps.scan.outputs.broken }}'
        if ($broken) {
          # Named rather than folded into the total. A window that could not be
          # scanned is not a window with nothing wrong with it, and a summary
          # that does not say which is the kind of check that looks maintained
          # while covering less than it claims.
          Add-Content $env:GITHUB_STEP_SUMMARY "**Some windows were not scanned at all:** $broken"
          Add-Content $env:GITHUB_STEP_SUMMARY ''
        }
        $perWindow = '${{ steps.scan.outputs.perwindow }}'
        if ($perWindow) {
          Add-Content $env:GITHUB_STEP_SUMMARY "UI Automation violations per window: $perWindow"
          Add-Content $env:GITHUB_STEP_SUMMARY ''
        }
        $unnamed = '${{ steps.scan.outputs.unnamed }}'
        if ($unnamed) {
          Add-Content $env:GITHUB_STEP_SUMMARY "**A control somebody operates has no name on the channel NVDA reads, in these windows:** $unnamed"
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY 'The scan log names each one and where it sits. Open the `msaa-names.json` beside it for the whole tree.'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
        }
        $count = '${{ steps.scan.outputs.violations }}'
        if ($count -eq '0') {
          Add-Content $env:GITHUB_STEP_SUMMARY 'No violations found by the automated scan.'
        } else {
          Add-Content $env:GITHUB_STEP_SUMMARY "**$count violation(s) found.** The scan step log lists each one with its control type and class name."
        }
        Add-Content $env:GITHUB_STEP_SUMMARY ''
        Add-Content $env:GITHUB_STEP_SUMMARY 'Download the `accessibility-scan-results` artifact and open it with Accessibility Insights for Windows to inspect them.'
        Add-Content $env:GITHUB_STEP_SUMMARY ''
        Add-Content $env:GITHUB_STEP_SUMMARY 'This scan covers about half of WCAG, on both accessibility channels: UI Automation, which Narrator reads, and MSAA, which NVDA reads for native controls and which is the only place `set_accessible_name` puts anything. A clean result means the structure is present, not that the experience is good. It is not a substitute for testing with NVDA.'

    - name: Upload scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-scan-results
        path: a11y-results/
        if-no-files-found: warn
