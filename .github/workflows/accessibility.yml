name: Accessibility

# Automated scanning of the running application, on both accessibility channels.
#
# Windows has two. Axe.Windows reads UI Automation, which is what Narrator uses.
# The second step walks MSAA through IAccessible, which is what NVDA uses for
# native controls and the only place `set_accessible_name` puts anything: for an
# edit box or a button, Windows supplies its own UI Automation provider that
# shadows the MSAA object underneath, so the UI Automation scan reports the
# system's name and never the one this code set. It had therefore never measured
# a single accessible name in this application, in either direction, and would
# not have noticed every one of them being deleted.
#
# Together they catch roughly half of accessibility defects, which is a figure
# about defects and not about criteria: missing or empty accessible names,
# wrong control types, elements that do not report themselves as focusable.
# Nothing here measures contrast; until 2026-09-14 this sentence said the
# scanner could, and the v2.4.2 rule list has no rule that mentions it. Of the
# fifty-five WCAG 2.2 Level A and AA success criteria the rules cite three,
# and docs/wcag-coverage.md has the row for every one. Neither channel
# replaces testing with NVDA, JAWS, or Narrator. A clean scan means the
# structure is present, not that the experience is good.
#
# The job is non-blocking on purpose. Treat its findings as a work queue, not a
# gate, and read the uploaded report rather than the pass/fail badge.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  uia-scan:
    name: Accessibility scan
    runs-on: windows-latest
    continue-on-error: true

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.98.1

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-a11y-${{ hashFiles('**/Cargo.lock') }}

    - name: Build application
      run: cargo build --release --verbose

    - name: Install Axe.Windows CLI
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force tools/axe-windows | Out-Null

        # Pinned, on Pratik's answer of 2026-09-14. This fetched
        # releases/latest, so the rule set the scan ran was whatever Microsoft
        # had published most recently, and it could move without a commit
        # here; the rule table read twice five days apart did not agree, and
        # nobody could say how much was upstream moving. A coverage document
        # saying which WCAG criteria this scan can judge is a claim about a
        # rule set, so the rule set has to be one a document can name.
        #
        # The tag alone is not enough: whoever owns the repository can move a
        # tag. The hash is of the zip itself, so what runs is one binary and
        # not a name. Both read on 2026-09-14 from
        # https://api.github.com/repos/microsoft/axe-windows/releases, where
        # v2.4.2 was the newest release, published 2024-11-01, and the zip was
        # hashed with sha256sum and Get-FileHash, which agreed. The release
        # also ships axe-windows-rules-2.4.2.md, the rule list for exactly
        # this version, which is what a coverage list should be read against.
        #
        # To move the pin: pick a tag from that endpoint, download its
        # AxeWindowsCLI zip, hash it, and write both here with the date.
        $tag = 'v2.4.2'
        $zip = "AxeWindowsCLI-$($tag.TrimStart('v')).zip"
        $expected = 'aeca43f41c89b3ffb1db84011539e609ecd7cb3badd6e78fada2ada327d10a64'
        Invoke-WebRequest "https://github.com/microsoft/axe-windows/releases/download/$tag/$zip" -OutFile axe-cli.zip
        $actual = (Get-FileHash -Algorithm SHA256 axe-cli.zip).Hash.ToLowerInvariant()
        if ($actual -ne $expected) {
          # Not expanded and not run. A binary that is not the one this file
          # names is not a scanner whose findings mean anything, whatever
          # else it might be.
          throw "$zip does not match the pinned hash: expected $expected, got $actual"
        }
        Expand-Archive axe-cli.zip -DestinationPath tools/axe-windows -Force
        if (-not (Test-Path tools/axe-windows/AxeWindowsCLI.exe)) {
          throw "$zip did not contain AxeWindowsCLI.exe at its root, so the scan step would find nothing to run"
        }
        Write-Host "Installed $zip, SHA-256 $actual"

    - name: Scan the running application
      id: scan
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        # One run per window. --processid covers every window the process owns,
        # which sounds like everything and is not: at the moment of the scan
        # the process owns one window, so every dialog in the application, and
        # therefore most of its controls, had never been scanned by anything.
        #
        # The names are the ones src/presentation/scan_target.rs accepts, and
        # it refuses one it does not know rather than starting normally, so a
        # typo here fails loudly instead of scanning the main window twice and
        # calling it a pass.
        #
        # Every window a fresh profile can reach, on Pratik's answer of
        # 2026-09-14, rather than the eleven that happened to be here. The
        # six *-module names are the main window with one module showing and
        # nothing over it. 'main' is not that: with no target the first-run
        # question opens over the frame on a fresh profile, so 'main' has
        # always been the frame under a modal, and neither the bare window
        # nor the other five panels had been scanned by anything. Two tests
        # in scan_target.rs hold this list and ScanTarget::ALL together.
        #
        # The five *-editor names, added 2026-09-16 (#42, #40), are editors
        # that open only from inside a manager, behind Add or Edit, so the
        # manager targets never reached them and two testers met an unnamed
        # checkbox in two of them. Each opens directly on a fixture.
        #
        # The page target, added 2026-09-20 (#80), is the formatted message window,
        # the default way a message opens; 'reader' opens the plain-text
        # reader, so the default surface had never been scanned. The NVDA
        # workflow's case for #80 launches the same target.
        #
        # The page-window target, added 2026-09-22 (#80, 12-02), is the
        # separate window a link opens in. In the shipped program that is a
        # process of its own with a browser profile of its own; this target
        # builds the same window inside the process the scan launched, on a
        # document rather than a live page, because the scan walks the tree
        # of the process it started and the runner has no network.
        #
        # The feedback target, added 2026-09-23 (#64, 12-05), is Send
        # Feedback, opened on made-up facts and no log, so it reads nothing
        # about the runner. A fresh profile has no account, so it opens with
        # Send shut and the sentence saying why, which is also walked.
        $targets = @(
          'main', 'settings', 'accounts', 'compose', 'reader', 'search', 'filters', 'calendar', 'first-run', 'add-calendar', 'blocked-senders',
          'columns', 'which-copy', 'destination', 'folder-choice', 'new-event', 'contacts', 'tags', 'signatures', 'reminder', 'conversation',
          'which-days', 'send-later', 'add-address-book', 'about', 'feedback',
          'mail-module', 'calendar-module', 'contacts-module', 'reminders-module', 'tasks-module', 'notes-module',
          'contact-editor', 'condition-editor', 'filter-editor', 'signature-editor', 'account-editor',
          'page', 'page-window'
        )

        # Point the app at a throwaway profile so the scan never touches real
        # user data and always starts from the same first-run state.
        #
        # WIXEN_MAIL_DATA, not LOCALAPPDATA. The application finds its folder
        # through the Windows known-folder API, which does not read
        # LOCALAPPDATA, so setting that isolated nothing: it looked like a
        # throwaway profile and was the real one.
        $env:WIXEN_MAIL_DATA = Join-Path $env:RUNNER_TEMP 'a11y-profile'
        New-Item -ItemType Directory -Force $env:WIXEN_MAIL_DATA | Out-Null

        $total = 0
        $broken = @()
        $perWindow = @()
        # Windows holding a control somebody operates that has no name on the
        # channel NVDA reads.
        $unnamed = @()

        foreach ($target in $targets) {
          # Axe.Windows rejects a relative --outputdirectory, and each window
          # gets its own so the artifact says which result came from where.
          $outDir = Join-Path (Get-Location) "a11y-results/$target"
          New-Item -ItemType Directory -Force $outDir | Out-Null

          $arguments = if ($target -eq 'main') { @() } else { @("--scan-target", $target) }
          $app = Start-Process -FilePath 'target/release/wixen-mail.exe' `
            -ArgumentList $arguments -PassThru
          try {
            # wxWidgets needs a moment to realise the frame and publish its
            # UI Automation tree. Poll rather than guess at a fixed sleep.
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and $app.MainWindowHandle -eq 0 -and -not $app.HasExited) {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
            }
            # The dialog opens after the main frame is shown, so give it a
            # moment to exist before walking the tree.
            if ($target -ne 'main' -and -not $app.HasExited) { Start-Sleep -Seconds 3 }

            # Asked before the scan, not after. A dialog that fails to open
            # leaves the main window up, and the application leaves with
            # code 3 rather than let the scan walk that window and report a
            # pass for a dialog nobody looked at. The two ways of having
            # exited are different failures with different fixes, so the
            # message says which.
            $app.Refresh()
            if ($app.HasExited) {
              if ($app.ExitCode -eq 3) {
                $broken += "$target : the application said the window was not open and left, so there was nothing to scan"
              } else {
                $broken += "$target : the application exited with code $($app.ExitCode) before the scan"
              }
              continue
            }
            if ($app.MainWindowHandle -eq 0) {
              $broken += "$target : no window appeared within 60s"
              continue
            }

            # Axe exits non-zero both when it finds violations and when it
            # fails to scan at all, so the exit code alone cannot tell those
            # apart. Whether it wrote a result file is what distinguishes them,
            # and that check has to be per window: one window failing to scan
            # while the others succeed would otherwise be invisible, because
            # the directory would still have files in it.
            #
            # --alwayssavetestfile, because by its own --help the CLI writes
            # a file only when it found errors. Without it a clean window
            # wrote nothing and was reported below as "the scan itself
            # failed": the run of 2026-09-10 said that of seven of eleven
            # windows, each of which had printed "0 errors were found" a
            # line earlier. With it, no file means exactly what the message
            # says.
            $PSNativeCommandUseErrorActionPreference = $false
            $output = & tools/axe-windows/AxeWindowsCLI.exe `
              --processid $app.Id `
              --outputdirectory $outDir `
              --alwayssavetestfile `
              --verbosity verbose 2>&1
            Write-Host "--- $target ---"
            $output | Out-String | Write-Host

            if (-not (Get-ChildItem $outDir -Filter *.a11ytest -ErrorAction SilentlyContinue)) {
              $broken += "$target : no result file, so the scan itself failed (exit $LASTEXITCODE)"
              continue
            }

            # "8 errors were found" / "1 error was found" / "No errors were found".
            # The singular is real and was not matched until 2026-09-14: three
            # windows that each printed one error were recorded as clean, and
            # the run's total said 26 where the log held 29. A test in
            # scan_target.rs reads this pattern and holds it to all three.
            #
            # -First 1 is a hole that is still open: a window that writes two
            # result files prints two of these lines, and only the first is
            # counted. The reader window wrote two on 2026-09-14, both clean,
            # so nothing was lost that day. Ledgered rather than fixed here,
            # because nothing in the tree can run this block to prove a sum.
            $summary = ($output | Select-String -Pattern '(\d+) errors? (?:was|were) found|No errors were found' | Select-Object -First 1)
            $count = if ($summary -and $summary.Matches[0].Groups[1].Success) {
              [int]$summary.Matches[0].Groups[1].Value
            } else { 0 }
            $total += $count
            $perWindow += "$target : $count"
            Write-Host "$target scanned with $count violation(s)."

            # The other channel, on the same running window. Exit 0 is every
            # operated control named and 1 is one that is not. Anything else
            # is a walk that did not happen, recorded as broken rather than
            # as a pass: 2 is the script saying so, and any other code is
            # the script dying before it could say anything, which read as a
            # clean walk until 2026-09-14 because only 2 was asked about.
            $PSNativeCommandUseErrorActionPreference = $false
            & pwsh -NoProfile -File scripts/msaa-names.ps1 `
              -ProcessId $app.Id `
              -Json (Join-Path $outDir 'msaa-names.json')
            $msaaExit = $LASTEXITCODE
            if ($msaaExit -eq 1) {
              $unnamed += $target
            } elseif ($msaaExit -ne 0) {
              $broken += "$target : the MSAA walk failed (exit $msaaExit), so its names were never read"
            }
          }
          finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
        }

        "violations=$total" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        ($perWindow -join '; ') | ForEach-Object { "perwindow=$_" } |
          Out-File -FilePath $env:GITHUB_OUTPUT -Append
        ($broken -join '; ') | ForEach-Object { "broken=$_" } |
          Out-File -FilePath $env:GITHUB_OUTPUT -Append
        ($unnamed -join ', ') | ForEach-Object { "unnamed=$_" } |
          Out-File -FilePath $env:GITHUB_OUTPUT -Append

        if ($broken.Count -gt 0) {
          # A window that could not be scanned is not a window with no
          # problems. Saying so is the whole reason this distinction exists.
          throw "These windows were not scanned: $($broken -join '; ')"
        }
        Write-Host "All $($targets.Count) windows scanned, $total violation(s) in total."

    - name: Summarise findings
      if: always()
      shell: pwsh
      run: |
        $results = Get-ChildItem a11y-results -Recurse -Filter *.a11ytest -ErrorAction SilentlyContinue
        Add-Content $env:GITHUB_STEP_SUMMARY '## Accessibility scan'
        Add-Content $env:GITHUB_STEP_SUMMARY ''
        if (-not $results) {
          Add-Content $env:GITHUB_STEP_SUMMARY 'The scan did not run. No result file was produced, so this is a broken scan rather than a clean one. Check the scan step log.'
          exit 0
        }
        $broken = '${{ steps.scan.outputs.broken }}'
        if ($broken) {
          # Named rather than folded into the total. A window that could not be
          # scanned is not a window with nothing wrong with it, and a summary
          # that does not say which is the kind of check that looks maintained
          # while covering less than it claims.
          Add-Content $env:GITHUB_STEP_SUMMARY "**Some windows were not scanned at all:** $broken"
          Add-Content $env:GITHUB_STEP_SUMMARY ''
        }
        $perWindow = '${{ steps.scan.outputs.perwindow }}'
        if ($perWindow) {
          Add-Content $env:GITHUB_STEP_SUMMARY "UI Automation violations per window: $perWindow"
          Add-Content $env:GITHUB_STEP_SUMMARY ''
        }
        $unnamed = '${{ steps.scan.outputs.unnamed }}'
        if ($unnamed) {
          Add-Content $env:GITHUB_STEP_SUMMARY "**A control somebody operates has no name on the channel NVDA reads, in these windows:** $unnamed"
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY 'The scan log names each one and where it sits. Open the `msaa-names.json` beside it for the whole tree.'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
        }
        $count = '${{ steps.scan.outputs.violations }}'
        if ($count -eq '0') {
          Add-Content $env:GITHUB_STEP_SUMMARY 'No violations found by the automated scan.'
        } else {
          Add-Content $env:GITHUB_STEP_SUMMARY "**$count violation(s) found.** The scan step log lists each one with its control type and class name."
        }
        Add-Content $env:GITHUB_STEP_SUMMARY ''
        Add-Content $env:GITHUB_STEP_SUMMARY 'Download the `accessibility-scan-results` artifact and open it with Accessibility Insights for Windows to inspect them.'
        Add-Content $env:GITHUB_STEP_SUMMARY ''
        Add-Content $env:GITHUB_STEP_SUMMARY 'What this scan can judge: of the fifty-five WCAG 2.2 Level A and AA success criteria, the Axe.Windows rules can produce a finding against three, 1.3.1 Info and Relationships, 2.1.1 Keyboard and 4.1.2 Name, Role, Value, on UI Automation, which Narrator reads. The MSAA walk, on the channel NVDA reads for native controls and the only place `set_accessible_name` puts anything, judges the Name part of 4.1.2 and nothing else. The other fifty-two criteria are a person''s to judge, and docs/wcag-coverage.md has the row for every one. A clean result means the structure is present, not that the experience is good. It is not a substitute for testing with NVDA.'

    - name: Upload scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-scan-results
        path: a11y-results/
        if-no-files-found: warn

    # The running program's own log, from the scan's throwaway profile, so a
    # scan says what the program did as well as what the scanner read. Added
    # 2026-09-24 for 12-06.1, whose spin-control naming reached the field in
    # a test process and not in the program. The profile is made fresh on
    # the runner and holds only the scan's fixtures, no account and no mail.
    - name: Print the program's naming lines
      if: always()
      shell: pwsh
      run: |
        $logs = Join-Path $env:RUNNER_TEMP 'a11y-profile/logs'
        if (-not (Test-Path $logs)) {
          Write-Host "No logs folder at $logs, so the program wrote no log the scan can hand back."
          exit 0
        }
        $lines = Get-ChildItem $logs -Filter *.log | Get-Content |
          Where-Object { $_ -match 'for the accessibility scan|spin-field-naming:' }
        $opening = @($lines | Where-Object { $_ -match 'for the accessibility scan' }).Count
        $naming = @($lines | Where-Object { $_ -match 'spin-field-naming:' }).Count
        if ($naming -eq 0) {
          Write-Host "A log with no naming lines: $opening Opening line(s) and 0 spin-field-naming lines."
        } else {
          Write-Host "$opening Opening line(s) and $naming spin-field-naming line(s):"
        }
        $lines | ForEach-Object { Write-Host $_ }

    - name: Upload the program's log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-scan-program-log
        path: ${{ runner.temp }}/a11y-profile/logs/
        if-no-files-found: warn
