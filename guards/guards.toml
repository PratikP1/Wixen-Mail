# ── A change the mail server refused, reported as one that happened ─────────
#
# Two of the commands that write to a mailbox were sent through a helper that
# hands the result back as a stream, and that stream ends at the server's
# answer without ever reading what the answer was. A refusal came back looking
# exactly like a change that worked. Every flag this program sets went through
# one of them, and the other is the command that removes a message, so a person
# was told "Deleted" over mail still sitting in the folder.
#
# Neither result was used for anything. Both are sent as plain command lines
# now, which is the only form in this library that reads the answer.

[[guard]]
name = "a flag the mail server refused is not reported as set"
file = "src/service/protocols/imap.rs"
before = """        with_timeout(
            COMMAND_TIMEOUT,
            self.session
                .run_command_and_check_ok(format!("UID STORE {uid} {operation} ({flag})")),
            "changing a message flag",
        )
        .await?
        .map_err(protocol_error("Could not change the message"))
    }"""
after = """        let stream = with_timeout(
            COMMAND_TIMEOUT,
            self.session
                .uid_store(uid.to_string(), format!("{operation} ({flag})")),
            "changing a message flag",
        )
        .await?
        .map_err(protocol_error("Could not change the message"))?;
        let _: Vec<Fetch> = stream
            .try_collect()
            .await
            .map_err(protocol_error("Could not change the message"))?;
        Ok(())
    }"""
red = [
    "service::protocols::imap::against_a_server_that_answers::test_a_move_that_fails_at_the_flag_has_already_made_the_copy",
]

[[guard]]
name = "a message the mail server would not remove is not reported as removed"
file = "src/service/protocols/imap.rs"
before = """        with_timeout(
            COMMAND_TIMEOUT,
            self.session
                .run_command_and_check_ok(format!("UID EXPUNGE {uid}")),
            "deleting the message",
        )
        .await?
        .map_err(protocol_error("Could not delete the message"))
    }"""
after = """        let stream = with_timeout(
            COMMAND_TIMEOUT,
            self.session.uid_expunge(uid.to_string()),
            "deleting the message",
        )
        .await?
        .map_err(protocol_error("Could not delete the message"))?;
        let _: Vec<u32> = stream
            .try_collect()
            .await
            .map_err(protocol_error("Could not delete the message"))?;
        Ok(())
    }"""
red = [
    "service::protocols::imap::against_a_server_that_answers::test_a_move_that_fails_at_the_expunge_leaves_the_message_in_both_places",
]

# ── How many previous drafts were really removed ────────────────────────────
#
# The caller writes the new copy as soon as this comes back without a failure.
# On a server that can only flag the old copy and leave it, a count of what was
# found rather than what went ends the day with two drafts and neither of them
# obviously the newer.

[[guard]]
name = "a draft only flagged for removal is not counted as removed"
file = "src/service/protocols/imap.rs"
before = """            if !self.abilities.uid_expunge {
                continue;
            }
            self.expunge_one(*uid).await?;
            removed += 1;"""
after = """            if self.abilities.uid_expunge {
                self.expunge_one(*uid).await?;
            }
            removed += 1;"""
red = [
    "service::protocols::imap::against_a_server_that_answers::test_a_draft_that_could_not_be_removed_is_not_counted_as_removed",
]

# ── A blind copy is blind because of a default nobody wrote down ────────────
#
# The address is taken out of the header into the envelope and the header is
# then removed, so the recipient list carries no sign of it and neither does
# the copy filed in Sent. Turning that off is one call, it makes the whole
# thing easier to write, and it would put every blind address on the wire for
# every recipient to read.

[[guard]]
name = "a blind copy reaches the server and never the message"
file = "src/service/protocols/smtp.rs"
before = """    for bcc in &email.bcc {
        builder = builder.bcc(parse_mailbox(bcc, None)?);
    }"""
after = """    for bcc in &email.bcc {
        builder = builder.bcc(parse_mailbox(bcc, None)?);
    }
    builder = builder.keep_bcc();"""
red = [
    "service::protocols::smtp::against_a_server_that_answers::test_a_blind_copy_reaches_the_server_and_never_the_message",
]

# ── Which mailbox a change is applied to ────────────────────────────────────
#
# A UID means a different message in every mailbox, so a change sent without
# opening the folder it names lands on whatever was open, under the right
# subject line. The older check for this threw the answer away and so could not
# tell a refusal from a success; these read the transcript of a server that
# answers.

[[guard]]
name = "a delete opens the folder it names before it removes anything"
file = "src/application/mail_controller.rs"
before = """        let session = &mut *guard;
        if session.selected_folder() != Some(folder) {
            session.select_folder(folder).await?;
        }
        session.delete_message(uid, trash).await"""
after = """        let session = &mut *guard;
        session.delete_message(uid, trash).await"""
red = [
    "application::mail_controller::against_a_server_that_answers::test_a_delete_that_half_happened_still_comes_back_as_a_plain_failure",
    "application::mail_controller::against_a_server_that_answers::test_changing_a_message_opens_the_folder_it_names_before_asking",
    "application::mail_controller::against_a_server_that_answers::test_deleting_a_message_past_an_open_gate_opens_its_folder_then_moves_it",
]

# ── And which mailbox a saved copy leaves alone ─────────────────────────────
#
# Saving a copy of a sent message deliberately opens nothing. Its caller is
# usually in the middle of reading a folder, and opening one here changes which
# mailbox is open underneath them.

[[guard]]
name = "saving a copy does not change which folder is open"
file = "src/application/mail_controller.rs"
before = """        let session = &mut *guard;
        session.append_message(into, flags, raw).await"""
after = """        let session = &mut *guard;
        session.select_folder(into).await?;
        session.append_message(into, flags, raw).await"""
red = [
    "application::mail_controller::against_a_server_that_answers::test_saving_a_copy_of_a_sent_message_appends_it_where_it_was_told",
]

# ── A mutation run that tested nothing, reported as one that found nothing ───
#
# Whether a run had produced anything was decided by asking whether its results
# file existed. That file is created empty before the first mutant is built, so
# a run whose build failed had one, it was empty, and the script printed that
# every mutant was caught and exited clean. The record written beside it said
# the build had failed the whole time.
#
# Underneath that, a failed build is recorded under one heading whichever way
# it failed: the compiler rejected the mutant, or the compiler never started.
# Only the first was tested. The whole-tree run of 2026-08-05 recorded 595 that
# way and 473 of them had never reached a compiler.
#
# All three run against the house style suite rather than the library, because
# these are rules about what the tree says. See `Guard.suite` in
# scripts/guards.py. The wording rules the reading itself follows are checked
# by its own doctests, which nothing here can run.

[[guard]]
name = "a mutation result is read from the record, not from the lists written for people"
file = "scripts/mutants.sh"
suite = "house_style"
before = """exec python scripts/mutants_report.py --exit-status "$STATUS" "$OUT/mutants.out\""""
after = """[ -s "$OUT/mutants.out/caught.txt" ]"""
red = [
    "test_no_mutation_result_is_read_from_the_lists_written_for_people",
]

[[guard]]
name = "the mutation script and the pull request check ask what a change touched the same way"
file = ".github/workflows/mutants.yml"
suite = "house_style"
before = """      run: scripts/mutants.sh --since origin/${{ github.base_ref }}"""
after = """      run: cargo mutants --in-diff changed.diff -j 2"""
red = [
    "test_what_a_change_touched_is_asked_the_same_way_in_both_places",
]

[[guard]]
name = "a mutation run that failed is not passed off as one that finished"
file = "scripts/mutants.sh"
suite = "house_style"
before = """    cargo mutants -j "$JOBS" --output "$OUT" || STATUS=$?"""
after = """    cargo mutants -j "$JOBS" --output "$OUT" || true"""
red = [
    "test_no_mutation_run_has_its_failure_swallowed",
]
