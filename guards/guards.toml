# ── What the clearing itself refuses ───────────────────────────────────────
#
# Every mask above is built from the notes' provider identities, so a note
# with one is load-bearing for as long as any provider could hand the event
# back. Three callers each decided for themselves whether a note was safe to
# clear, one decided wrong for three kinds of calendar at once, and every
# wrong answer resurrected a deleted event. The answer lives in the delete
# statement now: a note with a provider identity is refused, a note with none
# masks nothing and drains. Both directions are guarded, because widening the
# refusal is a table that grows for ever and narrowing it is a deleted event
# back on the screen.

[[guard]]
name = "forgetting a calendar deletion a provider could still hand back is refused"
file = "src/data/message_cache/calendar.rs"
before = """                "DELETE FROM deleted_calendar_events
                 WHERE id = ?1 AND provider_event_id IS NULL","""
after = """                "DELETE FROM deleted_calendar_events WHERE id = ?1","""
red = [
    "application::caldav_sync::tests::test_a_deletion_with_no_address_at_the_server_is_kept_and_masks_the_read",
    "application::calendar::tests::test_a_deletion_in_a_calendar_made_here_holds_across_three_syncs",
    "application::calendar::tests::test_a_deletion_in_a_read_only_calendar_of_this_account_holds_across_three_syncs",
    "application::calendar::tests::test_a_deletion_in_a_subscribed_calendar_is_kept_so_the_feed_cannot_hand_it_back",
    "application::calendar::tests::test_a_deletion_of_an_event_in_no_calendar_holds_across_three_syncs",
    "data::message_cache::calendar::tests::test_forgetting_a_deletion_a_provider_could_still_hand_back_is_refused",
]

