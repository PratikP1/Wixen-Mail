# ── Accessibility subsystem, from the 2026-08-22 mutation-sweep round ───────
#
# 31 misses across accessibility.rs, automation.rs, feedback.rs, names.rs and
# screen_reader.rs. Fifteen guarded below.
#
# Two are genuinely equivalent: names.rs's FOCUSABLE|SELECTABLE and
# FOCUSED|SELECTED, an OR read as an XOR. Every MSAA STATE_SYSTEM_* constant
# wxdragon defines is a single, distinct bit, so OR and XOR compute the same
# value on every input, not just the ones a test happened to try. Documented
# in place with debug_assert_eq!, the same pattern already used for the two
# disjoint dialog flags in asking.rs. No guard for these.
#
# Fourteen more need a live Windows accessibility control, a real screen
# reader attached to the machine, or the current foreground window to observe
# anything: Accessible::new's unconditional FFI call (names.rs's refresh,
# set_accessible_name, set_accessible_name_and_description, and the whole-
# function shape of set_accessible_checked_rows), the native:: UI Automation
# and MSAA calls in screen_reader.rs (announce_via_live_region,
# raise_notification, notify_name_change, and the whole-function shape of
# clients_are_listening), and feedback.rs's emit, a direct kernel32::Beep FFI
# call with no decision left to extract. Each is documented in place rather
# than guarded here; this project's test fakes construct a null window
# handle, not a live control, and wx_app.rs's own comment already explains
# why one process can run wxdragon::main at most once, which the parallel
# test binary rules out.
#
# Measured by hand: each guard applied alone, against the whole library,
# reddened exactly the test(s) named and nothing else. Restored and reran
# green after each. AutomationStore::update_state's guard reddens two tests,
# not one: Accessibility::update_node_state calls straight through to it, so
# breaking the lower layer breaks the integration test above it too.

