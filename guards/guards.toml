# already split out, which is hardly ever first. This guards the one line
# that makes it right: locating by UID and RECURRENCE-ID rather than falling
# back to the document's first VEVENT the way its sibling always does. That
# fallback is the exact naive shape a first attempt at this took, caught
# before it shipped: the series gets the change instead of the day, or the
# document is refused outright, and either way a sibling exception sitting
# beside the one being changed is exactly the case most likely to go unnoticed
