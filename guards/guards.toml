# ── The two conversation queries decide which messages exist with one text ──
#
# D-07 needs the number named before a deletion to be the number of messages
# that go. The doc comment above these two queries has said since it was written
# that they carry the same reach and the same qualifier on purpose, and that two
# queries agreeing today would drift the first time somebody changed one of
# them. It said it, and nothing checked it.
#
# They are one text now. `conversation_scope` is the whole `WITH` and each query
# is that plus its own `SELECT`, so the drift the comment warns about needs
# somebody to take one of them off the shared text first.
#
# Which is what the break is, and the reason is worth reading before anybody
# writes a simpler one. Both sides read `conversation_scope`, so editing the
# scope moves both together and they still agree: a guard over two things built
# from one source can never be falsified by editing that source. The break has
# to reintroduce the divergence the sharing removed, and that is also the defect
# the guard exists to prevent, which is the tell that it is the right one. It is
# written as the most plausible version of that mistake rather than an arbitrary
# one: the query as it stood before this change, with the thread qualifier left
# out.
#
# Measured by hand on 2026-09-04, the whole library: 6,108 passed and three
# failed. The reading, the agreement, and a delete on the archived-mail fixture,
# which is the one that says what a disagreement costs somebody: the question
# names two messages and the deletion takes three.

[[guard]]
name = "the two conversation queries decide which messages exist with one text"
file = "src/data/message_cache/messages.rs"
before = """pub(super) fn messages_in_one_conversation() -> String {
    format!(
        "{scope}
         SELECT m.id
         FROM here m
         WHERE m.thread_id = ?4
         ORDER BY m.received_at ASC, m.id ASC",
        scope = conversation_scope()
    )
}"""
after = """pub(super) fn messages_in_one_conversation() -> String {
    "WITH reach AS (
             SELECT id FROM folders
             WHERE account_id = ?1
               AND (?3 = 1 OR id = ?2)
         )
         SELECT m.id
         FROM messages m
         WHERE m.folder_id IN (SELECT id FROM reach)
           AND m.deleted = 0
           AND m.thread_id = ?4
         ORDER BY COALESCE(m.internaldate, m.date) ASC, m.id ASC"
        .to_string()
}"""
red = [
    "data::message_cache::messages::tests::test_a_delete_reaches_the_message_archived_with_no_label",
    "data::message_cache::messages::tests::test_both_conversation_queries_are_built_on_one_scope",
    "data::message_cache::messages::tests::test_the_row_and_the_action_agree_over_every_conversation_fixture_here",
]
tests_last_seen = [
