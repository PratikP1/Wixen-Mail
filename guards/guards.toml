# ── One contact, however many address books hold a copy ─────────────────────
#
# Every number in a contacts summary is a number of people. Each address book
# reads its own copy of the same person, so a count kept per copy said one edit
# had happened twice and somebody heard it said twice.

[[guard]]
name = "folding two address books counts one person once"
file = "src/application/contacts_sync.rs"
before = """    fn and(&self, others: &Contacts) -> Contacts {
        Contacts(self.0.union(&others.0).cloned().collect())
    }"""
after = """    fn and(&self, others: &Contacts) -> Contacts {
        use std::sync::atomic::{AtomicUsize, Ordering};
        static NEXT: AtomicUsize = AtomicUsize::new(0);
        Contacts(
            self.0
                .iter()
                .cloned()
                .chain(others.0.iter().map(|id| {
                    format!("{id}#{}", NEXT.fetch_add(1, Ordering::Relaxed))
                }))
                .collect(),
        )
    }"""
red = [
    "application::contacts_sync::tests::test_a_change_two_settings_hold_back_names_both_of_them",
    "application::contacts_sync::tests::test_a_contact_one_address_book_moved_is_not_also_called_unchanged",
    "application::contacts_sync::tests::test_folding_two_address_books_together_counts_one_contact_once",
    "application::contacts_sync::tests::test_folding_two_address_books_together_keeps_every_count",
    "application::contacts_sync::tests::test_one_edit_to_one_contact_both_books_hold_is_said_once_and_not_twice",
]

