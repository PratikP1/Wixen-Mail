# ── Nothing this program sends says a Google task is not deleted ────────────
#
# Google will take a change to this field, and every change this program sent
# carried it as false. Tick off a task here that somebody deleted on their
# phone: the change goes up before the read comes down, so the claim lands while
# the tombstone is still unread, Google puts the task back, and the read that
# follows finds it alive and keeps it. The deletion is undone and nothing is
# said.
