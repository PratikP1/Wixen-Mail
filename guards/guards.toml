# ── A name written back out is quoted when it needs to be ──────────────────
#
# `EmailAddress`'s `Display` wrote a name next to its address with no quoting
# at all. A name containing a comma read back as a second, non-existent
# recipient; a name containing a literal angle bracket read back as the start
# of a second address wrapper, corrupting the real one behind it. The break
# puts the old, unquoted line back.
#
# Measured by hand on 2026-08-16 with scripts/guards.py: all 10 tests named
# went red and nothing else did. (Corrected from an earlier count of 8: the
# break also reddens the escaping tests added a commit later, which the
# original count was taken before.)
#
# Measured by hand again on 2026-09-02, and that is the first measurement
# this record has allowed since the day it was written. Two of its ten names
# had not existed for seventeen days, so every run that reached it stopped at
# "the test harness never ran" before reporting anything about the break.
# The two tests were renamed, not removed. 8445b96, the same day and under
# four hours later, carried a recipient's display name onto the outgoing To
# and Cc headers and renamed the pair from `..._reaches_the_request_bare` to
# `..._reaches_the_request_with_the_name_kept`, widening each from asserting
# the address alone to asserting the address and the name both. That commit
# corrected those same two names in the record directly above this one and
# left them stale here. It re-measured the two records whose code it edited;
# this was the third, made stale by renaming tests it names rather than by
# touching the line it breaks, and nothing asked about that direction.
#
# Nothing stopped guarding the rule. All ten tests named on 2026-08-16 still
# go red, the renamed two included, and those two now assert more than they
# used to. What the record had wrong is the other direction: the break
# reddens 20 tests, not 10. Ten more read a name back through this same
# writer and none of them was written down. Replying to a sender whose name
# holds a bracket, exporting contacts, the people-lookup line, writing a
# message out to a file, and the message list's correspondent column all
# corrupt when the quoting comes off. All 20 went red, nothing else did, and
# the file was restored byte for byte from a copy taken before the break.

[[guard]]
name = "a name written back out is quoted when it needs to be"
