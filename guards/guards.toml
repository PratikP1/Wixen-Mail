# ── Security and safety subsystem, from the 2026-08-22 mutation-sweep round ─
#
# 46 misses and one timeout across credentials.rs, oauth_credentials.rs,
# safety.rs, security.rs and the four safebrowsing files. Nineteen guarded
# below.
#
# credentials.rs contributes none at all: its real `keyring::Entry`-backed
# store only runs outside `#[cfg(test)]`, and exercising it for real writes
# into whoever's running the tests' actual Windows Credential Manager, which
# is exactly how this file's own comment says an earlier test left an account
# called "acc-1" behind on a real machine.
#
# oauth_credentials.rs's `credentials_for`, `resolve_gmail`, `resolve_outlook`
# and `load_from_toml`, and safebrowsing's `api_key`, `refresh_lists` and one
# of `check_links`'s two `339:5` mutants, all need a real environment
# variable, a real gitignored `oauth.toml`, or a real answer from Google to
# ever return anything other than what a clean machine already returns, which
# both module doc comments already say plainly. `security.rs`'s
# `find_existing_key` is the same shape one layer down: its Windows branch
# reads the real Credential Manager and its file branch resolves the real
# per-machine data folder. None of the seven are guarded here.
#
# Three are genuinely equivalent and documented in place rather than guarded.
# `safety.rs`'s `Verdict::ordinary` is `Self::default()` written out, and a
# mutation swapping it for `Default::default()` calls the identical function;
# unlike an operator swap there is no external fact left to assert once the
# whole body is replaced, so this one carries a doc comment and no
# debug_assert. `safebrowsing/rice.rs`'s `(quotient << parameter) | remainder`
# cannot be told apart from `^`: the ceiling check just above guarantees the
# two operands never share a set bit, the same disjoint-bits shape asking.rs
# already reads with either operator, and this one does carry a
# debug_assert_eq! proving the operands stay disjoint. `safebrowsing/urls.rs`'s
# `p.len() > 1` cannot be told apart from `>= 1` either: the surrounding
# `.all()` guard already requires every part non-empty, so the two operators
# can only disagree at length one, and "0" reads the same in octal as decimal.
#
# One timeout, also in urls.rs's `unescape_once`, is real and already fixed,
# not guarded. `i += 3` on a genuine escape match, mutated to `i *= 3`, freezes
# the cursor at zero and grows the output forever; confirmed as a real hang
# under a 10-second kill, not a slow pass. The fix is two debug_assert!s
# proving the cursor moves after every branch, the same shape as
# `common/error.rs`'s pair from this same round: real code always advances by
# a positive amount, so neither assert ever fires outside the mutation that
# would have hung, and there is no separately-named test the record could
# point at.
#
# Measured by hand: each guard applied alone, against its own file's test
# module, reddened exactly the test(s) named and nothing else. Restored and
# reran green after each. Two entries redden two tests apiece where a second,
# independent local guard inside the same function also depends on the
# mutated line.

