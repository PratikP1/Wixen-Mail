# Guards, and the break each one is supposed to notice.
#
# A guard test is written, taken red once against the defect it defends, and
# then never measured again. The code around it goes on changing. Nothing
# re-asks whether it would still go red, so a guard can stop defending anything
# and keep its name, and the suite stays green the whole time.
#
# That has happened here. One commit added a "neither copy moved" arm to the
# contacts merge; two tests that used to reach the arm the guard was about
# started reaching the new one instead. Both arms do nothing, so every count,
# every sentence and every flag those tests asserted came out the same either
# way. Two guards became one, with two names still promising two, and it was
# found by hand three commits later.
#
# Each entry below is that measurement written down so a machine can take it
# again. `scripts/guards.sh` applies `before` -> `after`, runs the whole
# library, and requires the tests that failed to be exactly the ones named in
# `red`.
#
# Exactly, in both directions. It used to run only the named tests, which could
# see a `red` list longer than the truth and never a shorter one. So a record
# could quietly fall behind: "an edit written here and then lost is still
# counted and said" named eight tests for a break that reddens seventeen,
# because a later commit gave the function two new callers and nobody measured
# it again. Nine tests were guarding something nobody had written down and
# every run said the record was right. A record shorter than the truth is the
# thing this file exists to stop, so the run now notices.
#
# Adding one: take the break by hand first and write down what really went red,
# all of it. Do not write down the tests you expected.
#
# `before` has to appear exactly once in the file. When it stops appearing, the
# run fails and says so, which is the signal that somebody moved the code a
# guard is about and the guard needs measuring again by hand. That is not a
# reason to edit this file until the break matches; it is a reason to check the
# guard still discriminates and then write down what it does now.
#
# That rule is also checked at commit time now, by
# `test_every_guard_record_still_names_one_place_in_the_tree` in
# tests/house_style.rs, because a full run is an hour or two and nothing forces
# one. It says a record still points at one place. It cannot say the list of
# tests beside that record is still true; only a run says that.
#
# ── What the sweep of 2026-08-12 covered, and what it did not ───────────────
#
# 192 records were swept that day.
# 100 records have arrived since and have not been through it.
#
# Those two numbers add up to the records in this file, and
# `test_the_sweep_written_at_the_top_of_the_guard_records_covers_every_record_in_it`
# in tests/house_style.rs says so on every commit. Add a record and the second
# number goes up in the same edit. That is the whole reason it is written as
# two numbers: this section used to say "192 records, all 192 checked" under a
# heading that gave no sign of being a photograph, and by the time anybody read
# it again the file held 210. Eighteen records had never been near the sweep
# the heading described, and nothing said so.
#
# Everything below this line is about the file as it stood that day. It is not
# a description of the file now.
#
# All 192 were checked for pointing at exactly one place: none was ambiguous
# and none had moved. Every test named in a `red` list resolved to a test that
# was in the tree.
#
# That one property is the only thing here that cannot go stale, because it is
# checked on every commit for every record by
# `test_every_guard_record_still_names_one_place_in_the_tree`, as the paragraph
# above the heading says. Everything else in this section needs a sweep to be
# true again.
#
# 24 of the 192 were defended only by tests that read the tree as text. Every
# one of those was read and judged against one question: would it go red if the
# behaviour went while the source text stayed? Three could not. All three had
# one shape, a refusal that is said and then not acted on:
#
#   - the two arms that refuse a delete on an account with no recognised trash,
#     which were changed to say the refusal and carry on deleting
#   - the refusal about a day of a series that cannot be kept, which was changed
#     to say no and take the day off anyway
#   - the calendar window's own refusal, which was changed to say no and queue
#     the change in the same breath
#
# All three were guarded by the end of it, each by a record whose break is that
# narrower edit, and each was measured against the old guard first and seen to
# stay green. The other 21 read wiring facts with no runtime path in a test, and
# each of their tests says in its own words what stays green while the behaviour
# goes.
#
# 18 of the 192 were measured with the runner as part of that sweep. The rest
# were not: a full run is one build and one suite each and takes hours, and it
# needs a quiet machine.
#
# ── What changed on 2026-08-12, after that sweep ────────────────────────────
#
# The first of the three above is no longer a source read. Deciding whether to
# send a delete and sending it were moved into one function, so the three
# records about the two refusals are now defended by tests that hold a server
# and ask what it was told. All three were measured again with the runner and
# each reddens two such tests. That leaves two of the three, the two about the
# calendar, still standing on a reading of a file, and the records for both now
# say in their own words what stays green while the behaviour goes.
#
# The count of records defended only by a source read is therefore 21 rather
# than 24 as against the file of that day, and one more record has since been
# added for the order the folder tree is read in, which is measured against a
# database rather than read.
#
# ── Every sort in the program, asked whether anything guards it ─────────────
#
# Taken on 2026-08-13 by making each sort leave its collection in the order it
# arrived in, one at a time, and running the library. A stable sort told every
# pair is equal does exactly that, which is also the defect being hunted: a
# test whose fixture is already in the order it expects back cannot tell that
# apart from a sort that ran.
#
# 25 sorts in code that is not a test. 13 have something that goes red when
# they stop sorting. 12 have nothing.
#
# The twelve nothing guards, so the next person does not have to find them
# again: the agenda's own ordering in the calendar; the list of messages the
# server no longer has; the note list; the days a repeat falls on; the task
# list; the three that put the modules of the main window in their settled
# order; two of the seven ways of sorting the mail list; the identifiers a
# folder search hands back; and the spelling suggestions.
#
# Two of those twelve were closed the same day, which is why the count of
# sorts and the count without a guard do not move together: the seven ways of
# sorting the mail list now have two records of their own, further down. The
# folder tree was closed the day before. The other ten are written down here
# and not fixed, and each is a place where a fixture in the order it expects
# back would prove nothing.
#
# One thing this run got wrong first and is worth not repeating. It read
# cargo's "error: test failed" as a build that never compiled, so every sort
# that really was guarded came back as unmeasurable, which is the opposite
# answer. Ask whether the run printed a test result at all.

