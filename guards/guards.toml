# Both records below were written on 2026-09-02 for a reason that is new. A
# record's `file` and `suite` used to be read only by `scripts/guards.sh`, to
# know where to apply a break and which suite to run it against. `scripts/check.sh`
# now reads the same two fields the other way round: given a changed source
# file, which integration targets guard it, so that a guard living under
# `tests/` runs on the commits that could break it rather than only on the
# commits that change the test file.
#
# So a guard with no record here is a guard the gate cannot find. These two had
# none, and both cover a `src/presentation` module from outside it.
#
# Each suite holds exactly one `#[test]` function, for the one-live-window-per-
# process budget `tests/theme_reach.rs` explains: wxWidgets allows one
# application per process and `cargo test` gives each file under `tests/` its
# own process, so every window check in a file shares one test function. A break
# reaching several dialogs still reddens one name there. That is not a red list
# that shrank, and without this note the next re-measurement would read it as
# one, the same way the `manager_dialog_labels` record above has to say it.

# The item form built both of its check boxes with an empty label and named them
# through `set_accessible_name`, which writes MSAA and nothing else. Windows
# takes a native control's UI Automation name from its own window text, so the
# control was named for NVDA and unnamed for Narrator: correct on the channel
# somebody was listening on, and silent on the other.
#
# Measured by hand on 2026-09-02. The break reddens the one check in the suite,
# and the whole library passes through it untouched: 5,997 tests, none of them
# able to see a name that only exists on one accessibility channel, because
# seeing it needs a real control built by the platform. `house_style` and
# `wired` pass through it too. That is the point of an integration guard, and it
# is also why leaving it uncoupled cost so much: nothing else in the tree would
# ever have spoken.

[[guard]]
name = "a check box carries its own label rather than borrowing the text beside it"
file = "src/presentation/wx_item_form.rs"
suite = "checkbox_labels"
before = """            let c = CheckBox::builder(parent).with_label(field.label).build();"""
after = """            let c = CheckBox::builder(parent).build();"""
red = [
    "test_every_check_box_in_a_form_carries_its_own_label",
]
tests_last_seen = [
    { file = "src/presentation/wx_item_form.rs", tests = 14 },
    { file = "tests/checkbox_labels.rs", tests = 1 },
]

# What a manager window says after a delete, counted against the list as it is
# afterwards rather than as it was before.
#
# The break is the old length: `left` read before the row is removed instead of
# after. Only a condition list counts out loud, so a tag, a filter or a
# signature going says the same words either way and the defect is invisible
# there. A saved search with three conditions, one deleted, then says "3
# conditions now" over a list holding two.
#
# The file's name says the window stays open, and the checks in it are not about
# that: they are about `delete_selected` and `delete_selected_contact` removing
# the right row, marking the state changed, repainting the list, and saying the
# right sentence. The decision the name refers to, `what_it_still_needs` and
# `nothing_stops_this_closing`, is in the modal loop and nothing in that file
# reaches it. The break was chosen from what the file really asserts rather than
# from what its name suggests, and the first plausible break, closing the window
# on an emptied list, would have reddened nothing.
#
# Measured by hand on 2026-09-02. The whole library passes through this break,
# 5,997 tests, and so do `house_style`, `wired` and `manager_dialog_labels`. The
# sentence builder's own tests in `manager_words` are given the number, so they
# cannot see the caller handing them the wrong one. That is the gap this file's
# own comment names and it is measured here rather than assumed.

[[guard]]
name = "a delete says how many rows are left rather than how many there were"
file = "src/presentation/wx_managers.rs"
suite = "manager_delete_stays_open"
before = """        let mut s = state.borrow_mut();
        s.working.remove(idx);
        s.changed = true;
        drop(s);
        let left = state.borrow().working.len();"""
after = """        let mut s = state.borrow_mut();
        let left = s.working.len();
        s.working.remove(idx);
        s.changed = true;
        drop(s);"""
red = [
    "test_delete_removes_the_right_row_against_real_widgets",
]
tests_last_seen = [
    { file = "src/presentation/wx_managers.rs", tests = 44 },
    { file = "tests/manager_delete_stays_open.rs", tests = 1 },
]

[[guard]]
# The conversation view starts hanging the message id off the row again.
#
# The obvious way to write this feature, and what it did until 02.1-05: the id
# looks like it belongs on the item. It does not go on the item.
# `set_custom_data` puts it in a process-global map in `wxdragon` and stores the
# map key on the row, and nothing takes it out again: `delete_all_items` goes
# straight to wxWidgets, which has never heard of the map, and
# `cleanup_all_custom_data` walks the tree through `clean_item_and_children`,
# which calls `remove_item_data` nowhere at all. So every opening of this dialog
# left one entry per message behind for the life of the program.
#
# The record above `no row in the folder tree hangs data off the control` says
# that leak has no observable behaviour and that a source read is therefore the
# only thing that can see it. That was wrong, and this record is the evidence.
# The registry hands out its keys from a monotonic counter and both
# `store_item_data` and `get_item_data` are public, so a throwaway entry either
# side of a build fences the keys that build issued, and asking the registry for
# each of them counts what is still there.
#
# Measured by hand on 2026-09-02 against this target: one test, which is the
# only test in it. The break leaves three entries behind for a three-message
# conversation, and the failure says so.
name = "the conversation view hangs its message ids off the control"
file = "src/presentation/wx_thread_view.rs"
suite = "tree_rows_leave_no_registry_entry"
before = """        items[row.node] = Some(item);"""
after = """        tree.set_custom_data(&item, nodes[row.node].message_id);
        items[row.node] = Some(item);"""
red = [
    "test_neither_tree_dialog_leaves_an_entry_in_the_process_global_registry",
]
tests_last_seen = [
    { file = "src/presentation/wx_thread_view.rs", tests = 9 },
    { file = "tests/tree_rows_leave_no_registry_entry.rs", tests = 1 },
]

