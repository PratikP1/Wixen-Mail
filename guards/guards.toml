# Underneath that, a failed build is recorded under one heading whichever way
# it failed: the compiler rejected the mutant, or the compiler never started.
# Only the first was tested. The whole-tree run of 2026-08-05 recorded 595 that
# way and 473 of them had never reached a compiler.
#
# On top of that, a run in which not one mutant ever reached the suite counted
# as a clean result: every mutant rejected by the compiler, or no mutants at
# all, printed a headline nobody could tell from a run that caught everything.
#
# All four run against the house style suite rather than the library, because
# these are rules about what the tree says. See `Guard.suite` in
# scripts/guards.py. The wording rules the reading itself follows are worked
# examples inside it, and the house style suite now runs them, so they hold on
# an ordinary change rather than only on the days somebody runs a mutation run.

[[guard]]
name = "a mutation result is read from the record, not from the lists written for people"
file = "scripts/mutants.sh"
suite = "house_style"
before = """exec python scripts/mutants_report.py --exit-status "$STATUS" "$OUT/mutants.out\""""
after = """[ -s "$OUT/mutants.out/caught.txt" ]"""
red = [
    "test_no_mutation_result_is_read_from_the_lists_written_for_people",
]

[[guard]]
name = "the mutation script and the pull request check ask what a change touched the same way"
file = ".github/workflows/mutants.yml"
suite = "house_style"
before = """      run: scripts/mutants.sh --since origin/${{ github.base_ref }}"""
after = """      run: cargo mutants --in-diff changed.diff -j 2"""
red = [
    "test_what_a_change_touched_is_asked_the_same_way_in_both_places",
]

[[guard]]
name = "a mutation run that failed is not passed off as one that finished"
file = "scripts/mutants.sh"
suite = "house_style"
before = """    cargo mutants -j "$JOBS" --output "$OUT" || STATUS=$?"""
after = """    cargo mutants -j "$JOBS" --output "$OUT" || true"""
red = [
    "test_no_mutation_run_has_its_failure_swallowed",
]

[[guard]]
name = "a mutation run that never reached the tests is not a result"
file = "scripts/mutants_report.py"
suite = "house_style"
before = """    if run.answered_by_the_suite == 0:"""
after = """    if False:"""
red = [
    "test_the_mutation_report_still_obeys_its_own_examples",
]

# ── A run the suite never finished against, read as one that found nothing ───
#
# The same shape as the four above, one layer along, and it shipped. Whether a
# run had learned anything was read off how many mutants were handed to the
# test suite. A mutant the suite hung on was handed to it, so a run in which
# every single mutant timed out passed that check, reached the summary, found
# nothing missed, and printed that every mutant which built was caught. Nothing
# had been caught, and run by hand it then exited zero.
#
# A timeout is a suite that was started and never got to the end. Nothing came
# back about that mutant, so the run knows neither that a test would notice nor
# that none would. It is not a catch and it is not a miss, and the three places
# that used to disagree about it now read one count: the refusal below, the
# summary, and the exit code.
#
# The last of these is the other half of the same job. A run can pass all three
# checks and still have been turned away from most of what it asked, because a
# mutant the compiler rejects is counted and says nothing. One run declared 84
# mutants, the suite answered for 30, and every sentence written about it
# afterwards quoted the 28 it caught. The proportion is printed in words now
# rather than left for somebody to work out of five bucket counts.

[[guard]]
name = "a mutation run the suite never finished against is not a result"
file = "scripts/mutants_report.py"
suite = "house_style"
before = """        return len(self.caught) + len(self.missed)
"""
after = """        return len(self.timed_out) + len(self.caught) + len(self.missed)
"""
red = [
    "test_the_mutation_report_still_obeys_its_own_examples",
]

[[guard]]
name = "a mutant the suite never finished against is not summed up as one it caught"
file = "scripts/mutants_report.py"
suite = "house_style"
before = """    if not run.missed and not run.timed_out:
        print("Every mutant that built was caught.")"""
after = """    if not run.missed:
        print("Every mutant that built was caught.")"""
red = [
    "test_the_mutation_report_still_obeys_its_own_examples",
]

[[guard]]
name = "a mutation run the suite never finished against does not pass"
file = "scripts/mutants_report.py"
suite = "house_style"
before = """    return 1 if run.missed or run.timed_out else 0"""
after = """    return 1 if run.missed else 0"""
red = [
    "test_the_mutation_report_still_obeys_its_own_examples",
]

[[guard]]
name = "a mutation report says how much of the run asked a question"
file = "scripts/mutants_report.py"
suite = "house_style"
