# ── What lets a deletion go ────────────────────────────────────────────────
#
# The other end of the rule. A note the provider has taken is let go of by the
# clock, so the three tables drain rather than growing for ever; a note nobody
# has taken is work rather than a memory and the clock must never touch it, or
