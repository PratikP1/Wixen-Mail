[[guard]]
name = "a folder with folders inside it is deleted deepest first"
file = "src/application/folders_underneath.rs"
# RFC 9051 section 6.3.5: "The DELETE command MUST NOT remove inferior
# hierarchical names." That is the exact opposite of RENAME, which section
# 6.3.6 requires to carry them along, and the two sit two sections apart in one
# document. A reader who had just implemented the rename is the most likely
# person to write the walk the wrong way round, because for a rename the order
# genuinely does not matter.
#
# What the break costs: the first DELETE goes to the folder at the top, which
# still has folders inside it. A server answers NO, the walk stops there, and
# nothing at all is deleted. So the visible symptom is a command that never
# works rather than one that destroys anything, which is the better of the two
# and is still a command that never works.
#
# The break reverses the order and nothing else. It is one call, and it is the
# smallest edit that turns a correct walk into a wrong one, which is what makes
# it worth recording: it would read as a tidy-up in a diff.
#
# Measured by hand on 2026-08-30 against the whole library: five tests, and the
# two beyond the three obvious ones are the point. `where_the_rows_move_to`
# reverses this walk to get shallowest first, so a rename's row updates depend
# on this order as well, in the opposite direction. Measuring by expectation
# would have named the three tests about deleting and missed both of those.
before = "    levels.into_iter().rev().flatten().collect()"
after = "    levels.into_iter().flatten().collect()"
red = [
    "application::folders_underneath::tests::test_a_folder_moved_under_another_takes_its_own_shape_with_it",
    "application::folders_underneath::tests::test_a_three_level_tree_comes_back_deepest_first",
    "application::folders_underneath::tests::test_renaming_a_folder_moves_every_row_underneath_it_too",
    "application::folders_underneath::tests::test_the_separator_each_row_already_had_is_the_one_it_keeps",
    "application::folders_underneath::tests::test_two_branches_of_the_same_depth_both_come_back",
]
