# ── A count and the thing it counts ─────────────────────────────────────────
#
# Five modules used to answer this question in their own words and two of them
# got it wrong, so "1 errors" and "1 changes are waiting here ... to send them"
# were both read out. There is one routine now, and this is the whole family in
# one break.

[[guard]]
name = "a count and the thing it counts agree in number"
file = "src/service/caldav.rs"
