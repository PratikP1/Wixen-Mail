# ── vtimezone.rs's yearly-rule detection and repeating.rs's Outlook range ──
#
# A scoped sweep of `src/service/vtimezone.rs` found 15 missed mutants and 1
# TIMEOUT; `src/application/repeating.rs` found 2. Twelve of the fifteen
# vtimezone.rs misses are guarded below. The rest: `the_change_between`'s `>`
# against `>=` is genuinely equivalent (its only caller only ever supplies a
# gap that is a whole number of days, so the two operators can never diverge
# in what they return) and is documented with a `debug_assert!`; the two
# December-branch mutants on `year + 1` are equivalent for a different reason
# (December always holds 31 days, so the function's return value cannot tell
# `year + 1` apart from `year - 1` or `year` itself); and the TIMEOUT in
# `changes_within` (`<` against `<=`, a genuine infinite loop once `at`
# reaches `end`) was closed with a `debug_assert!` on the loop's forward
# progress, not a test. None of those four get a guard here.
#
# The three `one_yearly_rule` onset guards share one `before`: the whole
# four-line condition, with three `||`. Applying cargo-mutants' actual
# AST-level swap for the middle and rightmost operators needs explicit
# parentheses, since `&&` binds tighter than `||` in Rust and a naive
# in-place substitution would test a different expression than the one the
# sweep actually reported.
#
# Measured by hand on 2026-08-19: each guard applied alone, against the
# whole library, reddened exactly the test(s) named and nothing else.
# Restored and reran green after each.

