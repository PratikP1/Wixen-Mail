# ── A postal address Google holds is kept here, so a change does not clear it ─
#
# The Google reader set both address columns to nothing, so an address held at
# Google was read into nothing at all. `addresses` is one of the fields a change
# to a contact names, Google clears every named field the body leaves out, and
# the body is built from the list the reader never filled. So editing a Google
# contact here for any reason, a nickname, a phone number, anything, took that
# person's postal address off their Google contact and said nothing about it.
#
# The break puts the reader back where it was. It is one line, and that is the
# point: the writer was already right and had been for a long time, and the
# whole loss sat in the half nobody read.
#
# Measured by hand on 2026-08-13 with scripts/guards.py.

[[guard]]
name = "a postal address Google holds is kept here rather than dropped"
file = "src/application/contacts_sync.rs"
before = """        phones_json,
        addresses_json,
        custom_fields_json: None,
        // Google's copy of the contact, as Google has it."""
after = """        phones_json,
        addresses_json: None,
        custom_fields_json: None,
        // Google's copy of the contact, as Google has it."""
red = [
    "application::contacts_sync::tests::test_a_google_sync_takes_a_postal_address_held_at_google_into_a_contact_already_known_here",
    "application::contacts_sync::tests::test_a_postal_address_google_holds_is_kept_here_and_sent_back",
    "application::contacts_sync::tests::test_a_postal_address_google_holds_only_as_one_line_is_kept_and_sent_back",
    "application::contacts_sync::tests::test_the_address_google_calls_the_main_one_is_the_one_this_program_calls_the_main_one",
]

