[[guard]]
# What the tree remembers, and where the cursor lands after a rebuild, are keyed
# on a row's identity. Finding that row again on screen is the one step that
# still has to go through words, because the binding gives nothing else:
# `TreeItemId` has no equality and its pointer is not public, so two items
# cannot be compared, and the only question a row answers is what it says.
#
# `where_a_row_sits` is what makes that sound. It collects the words of every
# row above one, and `the_row_on_screen` retraces the same chain with
# `get_item_parent`. Two rows under one parent never read the same, so the chain
# is unique where a single label is not.
#
# The break is the whole of the old behaviour: match on the row's own words and
# ignore what is above it. That is what this tree did until now, and since plan
# 01-03 made the stored folder name the leaf it means `Archive/2026` and
# `Work/2026` are one row as far as every lookup is concerned.
#
# Measured by hand on 2026-08-30 against the whole library: three tests.
#
# Re-measured on 2026-08-31, in 01-14, and it is four now. The record had gone
# stale without anything being wrong with it, which is the failure this file's
# both-directions check exists to catch: 01-08 added
# `test_two_accounts_pinned_inboxes_sit_under_a_branch_each_rather_than_side_by_side`
# for D-29, whose second half asks `where_a_row_sits` for the chain above each
# pinned copy and asserts the two differ. That reaches this rule, so it reddens
# here, and nobody re-measured after adding it. It was found by re-running this
# record after touching a neighbouring part of the same module, which is the
# only thing that finds this: no test failed, and the record read as true.
#
