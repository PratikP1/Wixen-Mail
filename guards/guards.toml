# ── A deletion that stops being noticed because nobody looks any more ────────
#
# The resume above buys its saving by asking about the uids above the highest
# one held, and a listing like that says nothing about the messages below it.
# So a folder that only ever resumes never sees a deletion: a message somebody
# removed on their phone stays listed here for good, and pressing Enter on it
# gets an error instead of mail.
#
# The bound is what stops that. Every six hours a folder is asked for the whole
# mailbox and compared, and a folder nothing has ever compared is compared on
# its next sync, so the bound cannot quietly mean "never".
#
# The break widens the interval to a hundred and fourteen years. Three tests go
# red out of a library of 6,163: the rule, the sync that acts on it, and the
# range assertion beside the constant.
#
# **The first measurement of this reddened one test, and that was the finding.**
# Both behaviour tests set their fixture to the interval plus a minute, so an
# offset taken from the constant moved with it: widen the interval and the
# fixture is a hundred and fourteen years stale and still due. Only the range
# assertion spoke, which is a check about the number rather than about the rule,
# so a widened bound would have shipped with the tests green. Both fixtures say
# twenty-four hours now, written out, and both go red.
#
# The other direction was taken by hand too, on 2026-09-04. Narrowing the
