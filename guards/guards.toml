# ── A SASL response line has to be told apart from an ordinary one ──────────
#
# AUTHENTICATE carries its credential differently from LOGIN and PASS: the
# server prompts with a bare "+" and the client answers on a line of its own,
# with no command word in front of it for without_the_credential to
# recognise. Nothing drove that exchange through this harness until the
# XOAUTH2 loopback test below did, and until then the gap was silent: the
# transcript is read by every failing assertion and printed with it, so an
# unredacted credential would have gone out with the first unrelated failure
# on a connection that happened to authenticate with a token.
#
# Measured by hand on 2026-08-14, against the whole library.

[[guard]]
