# This break adds code rather than removing it, which is unusual here and is
# the honest way round for this one.
#
# The plan this came from said to break the sent path by removing the
# conversation_root call from file_message_here. There is no such call to
# remove: file_message_here is upsert_message plus one UPDATE, so the single
# call inside upsert_message already serves both doors. The defect this guard
# is about is therefore not a deletion but an addition, and it is the exact
# addition the plan itself asked for: a second copy of the rule living in the
# filing path, disagreeing with the first. threading::as_stored's own doc
# comment says why that is the thing to fear, that two copies mean the same
# message threading one way when it arrives and another when it is sent.
#
# So the break writes a second answer over the first, using the message's own
# identifier and ignoring its chain. Measured by hand on 2026-08-30 against the
# whole library: one test, which is the one that stores the same message both
# ways and compares.
before = """    pub fn file_message_here(&self, incoming: &IncomingMessage) -> Result<i64> {
        let id = self.upsert_message(incoming)?;"""
after = """    pub fn file_message_here(&self, incoming: &IncomingMessage) -> Result<i64> {
        let id = self.upsert_message(incoming)?;
        self.conn
            .execute(
                "UPDATE messages SET thread_id = ?1 WHERE id = ?2",
                params![incoming.message_id.clone(), id],
            )
            .map_err(|e| Error::Other(format!("Failed: {}", e)))?;"""
red = [
    "data::message_cache::messages::tests::test_the_same_message_downloaded_and_filed_carries_one_conversation_id",
]
