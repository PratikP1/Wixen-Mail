# -- The shapes a stored moment can take ------------------------------------
#
# One column in one table, written five ways by four sources, and read by the
# announcement, by the two provider writers, by the calendar-server sync and by
# the reminder check. Three of those kept a list of the shapes and each knew a
# different subset. The two the reader was missing are the two Microsoft Graph
# writes, so every Outlook event was handed to the announcement as the stored
# string, and nothing was red: an unreadable moment comes back exactly as it was
# stored, which is the right fallback and looks the same as a date nobody has
# checked.
#
# The break takes the two shapes written with a T back out. Thirty-four tests in
# twelve modules go red, which is the shape of the thing: one list, read
# everywhere.
#
# That sentence said fourteen tests in six modules until 2026-09-02, and the
# count is corrected here from the run of 2026-09-01 rather than from a hand
# break of its own. Twenty more tests had arrived since the record was written,
# and where they arrived is the finding rather than how many: undo send, free
# and busy, the task writer and the spoken hour all read a stored moment
# through this one list, and none of the four is a subject anybody writing this
# record would have filtered for. Nothing here is a break that reaches too far.
