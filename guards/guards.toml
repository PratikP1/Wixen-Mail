# Guards, and the break each one is supposed to notice.
#
# A guard test is written, taken red once against the defect it defends, and
# then never measured again. The code around it goes on changing. Nothing
# re-asks whether it would still go red, so a guard can stop defending anything
# and keep its name, and the suite stays green the whole time.
#
# That has happened here. One commit added a "neither copy moved" arm to the
# contacts merge; two tests that used to reach the arm the guard was about
# started reaching the new one instead. Both arms do nothing, so every count,
# every sentence and every flag those tests asserted came out the same either
# way. Two guards became one, with two names still promising two, and it was
# found by hand three commits later.
#
# Each entry below is that measurement written down so a machine can take it
# again. `scripts/guards.sh` applies `before` -> `after`, runs the tests named
# in `red`, and requires every one of them to fail.
#
# Adding one: take the break by hand first and write down what really went red.
# A `red` list longer than the truth makes the run fail; shorter, and the guard
# is recorded as weaker than it is, which is the thing this file exists to
# stop.
#
# `before` has to appear exactly once in the file. When it stops appearing, the
# run fails and says so, which is the signal that somebody moved the code a
# guard is about and the guard needs measuring again by hand. That is not a
# reason to edit this file until the break matches; it is a reason to check the
# guard still discriminates and then write down what it does now.

# ── The two questions the contacts sync must not confuse ────────────────────
#
# What to keep is asked of the whole stored contact; what to send is asked of
# one address book. Asking the narrow question where the wide one belongs
# writes an address book's copy over an edit another address book has never
# been given.

[[guard]]
name = "the Google merge asks what the whole contact is owed"
file = "src/application/contacts_sync.rs"
before = """                        the_copy_here_holds_work_nobody_has_sent(local),
                        arrived_at.as_deref(),"""
after = """                        this_address_book_is_still_owed_the_change(local, &AddressBook::Google),
                        arrived_at.as_deref(),"""
red = [
    "application::contacts_sync::tests::test_a_change_only_outlook_still_needs_is_not_written_over_quietly_by_google",
    "application::contacts_sync::tests::test_a_change_only_outlook_still_needs_survives_a_google_read_that_moved_nothing",
    "application::contacts_sync::tests::test_a_contact_typed_here_that_google_already_holds_is_not_lost_without_a_word",
    "application::contacts_sync::tests::test_an_edit_an_address_book_replaced_is_said_once_and_not_on_every_later_sync",
    "application::contacts_sync::tests::test_the_other_address_book_setting_is_named_only_while_the_change_is_somebodys_work",
]

[[guard]]
name = "the Microsoft merge asks what the whole contact is owed"
file = "src/application/contacts_sync.rs"
before = """                        the_copy_here_holds_work_nobody_has_sent(local),
                        arrived_at,"""
after = """                        this_address_book_is_still_owed_the_change(local, &AddressBook::Microsoft),
                        arrived_at,"""
red = [
