# again the same day at 5674 after plan 01-11, and a third time at 5761 after
# plan 01-12. Five tests became seventeen and then twenty-one, and the reasons
# matter more than the numbers. 01-11 built a conversation listing that groups
# on this column, so twelve tests about counting and naming conversations came
# to depend on the writer. 01-12 built what a collapsed conversation row acts
# on, which reads the same column, so four more did: three about how far a
# delete reaches and one about a deleted conversation coming back whole.
#
# Three measurements, two of them prompted by the run saying the record had
# fallen behind rather than by anybody remembering to check. That is the whole
# point of it asking in both directions, and this record is now the clearest
# example in the file of a guard that would have quietly shrunk otherwise.
#
# The one worth having is still `test_sorting_by_thread_groups_a_conversation`:
# the Thread column's sort has always been "m.thread_id", so with the writer
# gone the sort silently orders every row by NULL, which is what nobody noticed
# for the life of the column.
#
# Measured a fourth time on 2026-08-31, after plan 01-13 moved the call out of
# the parameter list into a name above it, because the merge that plan added
# needs the same answer and computing it twice would be two places able to come
# to differ. The run said the recorded text was no longer in the file, which is
# the check working: the break now replaces what the parameter list passes, so
# the column goes back to holding NULL exactly as it did before, and the writer
# still exists above it for the merge to use.
#
# Twenty-one tests became thirty-one. Ten, not the eight this note first
# predicted before the run was taken: the number was written down as a guess,
# the run disagreed, and the guess is recorded here rather than quietly
# replaced, because the file's own rule is to write down what really went red
# and not what somebody expected.
