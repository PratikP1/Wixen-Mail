# ── A changed day of a CalDAV series has to be marked seen before it can be
#    forgotten again ─────────────────────────────────────────────────────────
#
# A day changed out of a CalDAV series is stored under an identity minted for
# it, "{uid}:{recurrence-id}", because a CalDAV override shares its series'
# own UID on the wire and has no identifier of its own. The pass that removes
# whatever a sync's answer did not name spares only a row whose identity is in
# seen_uids, so a changed day folded into storage without that identity being
# marked seen looks, to the very next sync, exactly like one the server had
# dropped, and is deleted the moment after it was created.
#
