# ── An occurrence exception is opened exactly as narrowly as intended ───────
#
# The refusal above stayed absolute for a day a calendar server already split
# into its own VEVENT until an earlier round: whichever of edit or delete was
# chosen, on a row like that, it was always refused. That round opened one
# door: changing the whole event, once this program has the series stored
# locally to change one VEVENT of the shared resource against rather than the
# whole document. A later round opened a second door the same narrow way:
# deleting the whole event, once a write primitive existed
# (`application::caldav_sync::delete_one_occurrence`) that marks the one
# VEVENT cancelled rather than removing the resource. A break that makes the
# escape clause always true reopens both doors for every combination at once,
# including a row whose series was never resolved, which has no document
# locally to change or cancel one VEVENT of.
#
# Three tests catch this now, and the two that walk `can_be_honoured`'s own
# matrix directly are the reliable ones: a network-level delete test that
# used to catch a wrongly widened door no longer can on its own, once a
# write primitive exists for deleting that is itself safe regardless of
# what this gate decides, because it routes on the row's own
# `provider_recurrence_id` rather than on anything the gate computed. That
# is not a reason to trust the gate less; it is a second, independent
# layer refusing the same thing this gate refuses. The third test is
# reliable for a different reason: forcing the door open lets an edit
# whose series was never resolved through too, and that one still fails
# downstream, because nothing before this line ever fetched a document to
# change.
