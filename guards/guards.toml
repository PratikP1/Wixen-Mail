# ── A row that is not a folder offered a folder's commands ───────────────────
#
# The break is not an invention. It is the answer the folder tree's closure
# gave from 01-14 until 02.1-08: a saved search gets its own menu and every
# other row gets a folder's, so nine kinds of row out of twelve were offered
# fetching older messages on a row with no messages to fetch, and choosing
# which folders are kept up to date on rows that name no account to choose for.
#
# Written as an early return rather than as a catch-all arm on purpose. A
# catch-all would make the arms below unreachable and change what the compiler
# says about the file, and the point of the record is to measure the tests
# rather than the warnings. This shape compiles clean and is exactly the old
# behaviour.
#
# What the number says, and it is the reason this record exists: measured by
# hand against the whole 6,039-test library on 2026-09-02, five, and all five
# are the tests written in the same plan. Nothing else in the library notices a
# folder tree that offers a folder's commands on a heading, which is what the
# fault being live since 01-14 already told us.

