# ── A change no setting let out ─────────────────────────────────────────────
#
# The push runs first and the read runs after it, in the same sync. A change a
# setting refused was offered to nobody before the read arrived to replace it,
# so the summary named a setting to turn on to send something that was already
# gone. Turning it on then sent nothing, twice over: once for each setting.

[[guard]]
