# ── Signed mail brought in from a file said nothing about its signature ─────
#
# Reading a file is the one path that has in its hands the exact bytes a
# signature was made over, and it dropped them. The message went into the folder
# reading as ordinary mail, which is a different claim from "signed, and not
# checkable here" and a false one. Silence reads as ordinary mail, so nothing
# about the message ever suggested there was anything to look at.
#
# The break leaves everything else about the import working, which is what the
# defect looked like: the message arrives, the folder count is right, and the
# only thing missing is the sentence nobody knows to expect.

[[guard]]
name = "signed mail brought in from a file keeps the bytes its signature is over"
file = "src/application/importing_messages.rs"
before = """    if let Some(raw) = &read.the_form_it_arrived_in
        && let Err(e) = cache.keep_signed_original(stored, raw)
    {
        tracing::warn!("Could not keep the form an imported signed message arrived in: {e}");
    }"""
after = """    let _ = &read.the_form_it_arrived_in;"""
red = [
    "application::importing_messages::end_to_end::test_a_signed_message_brought_in_from_a_file_can_still_have_its_signature_checked",
]
tests_last_seen = [
    { file = "src/application/importing_messages.rs", tests = 37 },
]

