# and no index over a header can answer a question about a name inside it.
# `identifiers_a_message_names` is that knowledge written down, and the second
# half of the lookup is what reads it.
#
# The break narrows the new question back to the old one: a recorded name
# counts only when it is that message's own identifier, which is exactly what
# the message column already answered. It keeps the shape of the statement and
# every bound value, so the parameter arithmetic is untouched and nothing
# reddens for a second reason.
