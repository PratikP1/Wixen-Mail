# -- A whole day sent to a calendar server is a day ------------------------
#
# A whole-day event that came from Google or from Graph keeps the day in its
# date columns and midnight in its datetime column, and the datetime column is
# the one this writer is given. Taking the dashes out of that produced
# DTSTART;VALUE=DATE:20260727T00:00:00Z, which is not a date, and a server that
# checks what it is sent refuses the whole change. Nothing carries such an event
# here today: the only route is moving it into a calendar server's calendar and
# presentation::managers::moving_can_be_told refuses to move any event a
# provider already holds. The guard is here so that removing that gate does not
# quietly open this.

[[guard]]
name = "a whole day goes to a calendar server as a day"
file = "src/service/caldav.rs"
before = """        (
            denormalize_ical_date(&event.dtstart),
            ";VALUE=DATE".to_string(),
        )"""
after = """        (event.dtstart.replace('-', ""), ";VALUE=DATE".to_string())"""
red = [
    "service::caldav::tests::test_a_whole_day_event_whose_column_holds_an_hour_still_goes_out_as_a_day",
]

# -- What a zone name of no letters means -----------------------------------
#
# Four writers read the zone-name column to decide where a clock face stands:
# the Google converter, the Graph converter, the event editor and the calendar
# server's document writer. Each answered "is this name a name" for itself and
# they gave three different answers. Google asked is_empty with no trim, so a
# name of one space was a zone; Graph trimmed, so the same event went to the two
# providers five and a half hours apart. The calendar server's writer asked
# nothing and wrote `DTSTART;TZID=:20260305T090000`, which is not a calendar
# document.
