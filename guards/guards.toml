# ── caldav.rs and caldav_sync.rs, from the same scoped sweep ────────────────
#
# caldav.rs: 16 misses in scope, including 4 of the round's 5 TIMEOUTs. The
# four TIMEOUTs (events_in's two, fits_in's two) are hand-confirmed genuine
# infinite loops that existing tests already reach; nothing needed fixing and
# nothing here can guard a mutation that never lets the runner finish. Three
# more misses are genuinely equivalent, each documented with a
# `debug_assert!`/`debug_assert_ne!` rather than a test: events_in's
# `closed + 1` against `closed * 1` (an event's own close line can never also
# be read as opening one, proven structurally); parameter_named_on's
# `semicolon > colon` against `>=` (a byte position can hold only one
# character, so the two can never name the same position); and
# parameter_named_on's slice starting at the semicolon itself rather than
# past it (an empty leading fragment never contains `=`, so it is always
# skipped the same way regardless). The other 9 are guarded below.
#
# caldav_sync.rs: 4 misses. One, `one_caldav_day_kept_out_of_its_series`
# dropping the explicit `pending` field from a struct literal built with
# `..series.clone()`, is genuinely equivalent for the same reason as
# calendar.rs's own version of this pattern, and is already a
# `debug_assert_eq!` in the source. The other 3 are guarded below.
