# ── Four answers to "which part of this file ships", three of them wrong ────
#
# A check that reads source text has to decide what a release build compiles.
# Four pieces of code decided it, and three cut at the first `#[cfg(test)]`
# anywhere in the file. An indented one on a test-only helper is ordinary Rust,
# so the contacts guard read 227 of 11123 lines and the outbound census read
# 186 of caldav's 6411. There is one answer now, in `common::what_ships`.
#
# The break below puts the naive cut back into the census. Measured on
# 2026-08-12: it reddens exactly one test, and that is worth being clear about.
# The census sweep over the tree stays green, because no file in the tree today
# hides a way out of this program behind an indented `#[cfg(test)]`. The only
# thing that notices is the test that hands the reading source text directly.
#
# So this record measures a reading, not a state of the tree. The day some file
# does hide a client that way, the sweep would go red too and this record would
# be short. That is the failure this file exists to catch, and it is caught by
# the run rather than by the record, so leave the record at one and let a run
# say when it has changed.
#
