[package]
name = "wixen-mail-search-handler"
version = "0.1.0"
edition = "2024"
publish = false
description = "Windows Search protocol handler and filter for the Wixen Mail message store"
license = "GPL-3.0-or-later"

# Two crate types on purpose. `cdylib` is the DLL Windows Search loads into
# SearchProtocolHost.exe; `rlib` is what `cargo test` links the unit tests
# against. Without the rlib the pure parts of this crate could not be tested at
# all, and the pure parts are the only parts that can be tested here.
[lib]
name = "wixen_mail_search"
crate-type = ["cdylib", "rlib"]

# The tool somebody runs to try this. Named in full rather than left to be
# discovered, because the name is what ends up beside the application and in
# the installer, and it should not change because a file was renamed.
#
# It is a separate program on purpose. The library registers itself by asking
# Windows which file the running code came from, so a tool that called that
# code directly would register the tool.
[[bin]]
name = "wixen-mail-search-setup"
path = "src/bin/wixen-mail-search-setup.rs"

[dependencies]
# The same version and the same bundled build as the main application, so the
# two are reading a database written by one library version rather than two.
# Bundled rather than system SQLite because this DLL is loaded by a Microsoft
# process that has no idea what is on this machine, and a missing sqlite3.dll
# would show up as the indexer quietly failing to load the handler.
rusqlite = { version = "0.40", features = ["bundled"] }

# Not behind a `cfg(windows)` target the way the main application's copy is.
# This crate is a Windows Search component and has nothing to be on any other
# platform, so it depends on Windows plainly and fails to build elsewhere
# rather than building into something that cannot work.
#
# Version matched to the main application so one `cargo update` cannot leave
# the two disagreeing about Windows types. Features are the smallest set that
# compiles the interfaces below:
#
#   Win32_System_Search             ISearchProtocol, IUrlAccessor
#   Win32_Storage_IndexServer       IFilter, STAT_CHUNK, FULLPROPSPEC
#   Win32_Storage_EnhancedStorage   the PKEY_* property keys. An odd home for
#                                   them, but it is where the Windows metadata
#                                   puts the contents of propkey.h
#   Win32_System_Com                IClassFactory, IPersistStream, IStream
#   Win32_System_Com_StructuredStorage  PROPSPEC and PROPVARIANT, which the
#                                   IFilter and IUrlAccessor vtables need
#                                   before they will compile at all
#   Win32_System_Variant            required alongside StructuredStorage by the
#                                   same vtables
#   Win32_Security                  RegCreateKeyExW takes security attributes,
#                                   so it needs this even though the ones
#                                   passed are None
#   Win32_System_Registry           self-registration
#   Win32_System_LibraryLoader      finding this DLL's own path to write into
#                                   InprocServer32, and loading the DLL from the
#                                   setup tool the way regsvr32 does
#   Win32_Security_Authorization    ConvertSidToStringSid, which is how the setup
#                                   tool turns the running account into the
#                                   identifier a crawl scope rule names
#   Win32_System_Threading          OpenProcessToken and GetCurrentProcess, to
#                                   ask who this program is running as and
#                                   whether it is elevated
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_IndexServer",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Search",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

# Named directly, not reached through `windows::core`. The `#[implement]`
# attribute writes out code that refers to `windows_core` by that name, so the
# crate has to be a dependency in its own right or nothing using the attribute
# compiles. Held at the version the `windows` crate above already pulls in, so
# there is only ever one copy of these types in the build.
windows-core = "0.62.2"

[dev-dependencies]
tempfile = "3.14"
